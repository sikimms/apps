<style>
:root{--bg:#0d1117;--card:#161b22;--line:#2a313c;--tx:#e6edf3;--sub:#8b949e;--up:#f0475a;--dn:#3d8bfd;--gold:#ffd54f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.top a{color:var(--sub);text-decoration:none;font-size:22px;padding:2px 6px}
.coin{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd54f 40%,#c99700 75%,#8a6400);box-shadow:inset 0 0 0 3px #ffe58a,0 3px 10px #0008;display:flex;align-items:center;justify-content:center;font:900 20px sans-serif;color:#7a5200}
.top h1{margin:0;font-size:19px}.top h1 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.badge{margin-left:auto;font-size:12px;font-weight:700;color:#111;background:var(--gold);border-radius:999px;padding:4px 10px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.price{font-size:32px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.chg{font-weight:800;font-size:15px}
.up{color:var(--up)}.dn{color:var(--dn)}
.flash{animation:fl .6s}@keyframes fl{0%{background:#ffffff22}}
.rng{display:flex;gap:6px;margin:10px 0 6px}
.rng button{flex:1;border:1px solid var(--line);background:none;color:var(--sub);border-radius:10px;padding:6px;font:700 13px inherit;cursor:pointer}
.rng button[aria-pressed=true]{background:#232a35;color:var(--tx);border-color:#3a4452}
canvas{width:100%;height:190px;display:block}
.hi{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.grid div{display:flex;flex-direction:column}.grid small{color:var(--sub);font-size:12px}.grid b{font-size:16px;font-variant-numeric:tabular-nums}
.tabs{display:flex;background:#0d1117;border-radius:12px;padding:4px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:9px;border-radius:9px;font:800 15px inherit;cursor:pointer}
.tabs button.on.buy{background:var(--up);color:#fff}.tabs button.on.sell{background:var(--dn);color:#fff}
.amt{display:flex;align-items:center;gap:8px;background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.amt input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:800 20px inherit;text-align:right;outline:none}
.amt span{color:var(--sub);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.quick button{border:1px solid var(--line);background:#1c222b;color:var(--tx);border-radius:10px;padding:8px 0;font:700 13px inherit;cursor:pointer}
.est{color:var(--sub);font-size:13px;text-align:right;min-height:1.3em}
.go{width:100%;border:0;border-radius:12px;padding:13px;font:900 17px inherit;color:#fff;cursor:pointer;margin-top:6px}
.go.buy{background:var(--up)}.go.sell{background:var(--dn)}
h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.news li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.news time{color:var(--sub);font-size:12px;flex:none;width:58px;white-space:nowrap;padding-top:2px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:8px;font-size:14px}
.rank .av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.rank .nm{flex:1}.rank .me{color:var(--gold);font-weight:800}
.nickb{margin-left:auto;border:1px solid var(--line);background:#1c222b;color:var(--tx);border-radius:999px;padding:4px 12px;font:700 12px inherit;cursor:pointer}
.nickf{display:flex;gap:6px;margin-bottom:10px}.nickf[hidden]{display:none}
.nickf input{flex:1;min-width:0;background:#0d1117;border:1px solid var(--gold);border-radius:10px;color:var(--tx);font:700 15px inherit;padding:8px 10px;outline:none}
.nickf button{border:0;border-radius:10px;background:var(--gold);color:#111;font:800 14px inherit;padding:0 14px;cursor:pointer}
.nickf small{display:block}
.rank b{font-variant-numeric:tabular-nums}
.foot{color:var(--sub);font-size:12px;text-align:center;line-height:1.6}
.ticker{overflow:hidden;white-space:nowrap;border-radius:10px;background:#1c1405;border:1px solid #4a3a10;color:#ffe9a8;font-size:13px;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tk 22s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}
</style></head>
<body>
<div class="wrap">
  <div class="top"><a href="./" aria-label="처음으로">‹</a><div class="coin">天</div><h1>천국코인 <small>HVN · 보드게임 천국 전용 가짜 코인</small></h1><span class="badge" id="dday">상장 D+0</span></div>
  <div class="ticker" aria-hidden="true"><span id="tick">🎉 천국코인 상장 기념! 오늘의 소식을 확인하세요</span></div>
  <div class="card">
    <div class="price" id="price">-</div>

  </div>
  <div class="card">
    <h2>💼 내 코인</h2>
    <div class="grid">
      <div><small>보유 수량</small><b id="mQty">0 HVN</b></div>
      <div><small>평균 산 값</small><b id="mAvg">-</b></div>
      <div><small>지금 가치</small><b id="mVal">0원</b></div>
      <div><small>수익</small><b id="mPnl">-</b></div>
      <div style="grid-column:1/3"><small>지갑 (게임 머니)</small><b id="mWal">-</b></div>

    <div class="amt"><input id="amt" inputmode="numeric" placeholder="0" aria-label="금액"><span id="unit">원</span></div>
    <div class="quick"><button data-q=".1">10%</button><button data-q=".25">25%</button><button data-q=".5">50%</button><button data-q="1">전부</button></div>

    <button class="go buy" id="go">사기</button>
  </div>
  <div class="card"><h2>📰 코인 뉴스</h2><ul class="news" id="news"></ul></div>

    <form class="nickf" id="nickF" hidden><input id="nickI" maxlength="10" placeholder="순위에 나올 내 이름" aria-label="내 이름"><button type="submit">저장</button></form>
    <ul class="rank" id="rank"></ul></div>
  <p class="foot">천국코인은 이 앱 안에서만 쓰는 장난 코인이에요. 진짜 돈·진짜 코인과 아무 관계가 없어요.<br>시세는 앱을 꺼 둔 동안에도 흘러가요.</p>
</div>
<script>/* ===== 보드게임 교실 공통: 지갑 · 매일 용돈 · 목소리 · 업적 배지 · 알림 =====
   휴대폰 앱(같은 주소)에서는 모든 게임이 이 지갑과 배지를 함께 쓴다. */
const FUNLS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const dayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
// 화면 위쪽 알림
function funToast(html,ms=2600){let box=document.getElementById('funToasts');
  if(!box){box=document.createElement('div');box.id='funToasts';box.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)';document.body.appendChild(box);}
  const t=document.createElement('div');t.innerHTML=html;t.style.cssText='background:#1f2a24;color:#fff;border:2px solid #ffd54f;border-radius:14px;padding:9px 16px;font:600 14px "Noto Sans KR",sans-serif;box-shadow:0 6px 18px #0007;opacity:0;transform:translateY(-10px);transition:all .3s;text-align:center';
  box.appendChild(t);requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='none';});setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-10px)';setTimeout(()=>t.remove(),350);},ms);}
const wonF=n=>(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString()+'원';

/* ---------- 지갑: 처음 만들 때 각 게임에 있던 돈을 모두 합쳐 옮김 ---------- */
const WALLET=(()=>{
  const K='bgc-wallet',KD='bgc-daily';
  function init(){let w=FUNLS.get(K,null);
    if(typeof w!=='number'){let sum=0,any=false;for(const g of ['gostop','seotda','poker']){const v=FUNLS.get(g+'-money',null);if(typeof v==='number'){sum+=Math.max(0,v);any=true;}}
      w=any?sum:300000;FUNLS.set(K,w);if(any)setTimeout(()=>funToast(`💰 게임마다 따로 있던 돈을 한 지갑에 합쳤어요: <b>${wonF(w)}</b>`,4200),600);}
    return w;}
  let bal=init();
  const get=()=>{const v=FUNLS.get(K,null);if(typeof v==='number')bal=v;return bal;};
  function set(v){bal=Math.round(v);FUNLS.set(K,bal);
    if(typeof ACH!=='undefined'){if(bal>=1000000)ACH.unlock('rich_1m');if(bal>=10000000)ACH.unlock('rich_10m');if(bal>=100000000)ACH.unlock('rich_100m');}}
  // 돈이 모자라면 다시 채워 줌 (가짜 돈이라 멈추지 않게)
  function rescue(min){const b=get();if(b>=min)return b;const v=Math.max(100000,min*4);set(v);funToast(`💸 돈이 모자라서 <b>${wonF(v)}</b>으로 채워 드렸어요`);return v;}
  // 오늘 얼마 땄나: 오늘 처음 연 때의 돈과 비교
  function today(){const d=FUNLS.get(KD,{});return d.date===dayKey()?get()-d.start:0;}
  // 매일 한 번 용돈
  // 11/18: 매일 한 번 용돈 카드 — 뒤집힌 카드 5장 중 하나를 골라 100만~5000만원 받기
  const dailyDone=()=>FUNLS.get(KD,{}).date===dayKey();
  function daily(){if(dailyDone())return 0;
    const go=()=>{if(document.body)setTimeout(()=>dailyPick(),700);else document.addEventListener('DOMContentLoaded',go,{once:true});};go();return 0;}
  function claimDaily(bonus){if(dailyDone())return 0;set(get()+bonus);FUNLS.set(KD,{date:dayKey(),start:get()});return bonus;}
  function reset(){set(300000);}
  return{get,set,rescue,today,daily,reset,claimDaily,dailyDone};
})();
function dailyPick(){
  if(WALLET.dailyDone()||document.getElementById('dpOv'))return;
  if(!document.getElementById('dpCss')){const st=document.createElement('style');st.id='dpCss';st.textContent=
`#dpOv{position:fixed;inset:0;z-index:9998;background:radial-gradient(ellipse at 50% 40%,#3a2c10 0,#120d04 55%,#000 90%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px;box-sizing:border-box;font-family:"Noto Sans KR",sans-serif;color:#fff;text-align:center;animation:dpIn .35s ease-out}
#dpOv>*{position:relative;z-index:1}
#dpOv::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 50%,#ffd54f40,transparent 70%);pointer-events:none}
#dpOv::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 82% 14%,#ffe082,transparent),radial-gradient(3px 3px at 70% 30%,#fff,transparent),radial-gradient(2px 2px at 22% 70%,#ffe082,transparent),radial-gradient(3px 3px at 88% 76%,#fff,transparent),radial-gradient(2px 2px at 40% 88%,#fff,transparent),radial-gradient(2px 2px at 8% 46%,#fff,transparent),radial-gradient(2px 2px at 94% 50%,#ffe082,transparent),radial-gradient(3px 3px at 30% 10%,#ffe082,transparent),radial-gradient(2px 2px at 58% 94%,#ffe082,transparent);animation:dpTw 2.2s ease-in-out infinite alternate}
@keyframes dpSpin{to{transform:rotate(360deg)}}@keyframes dpTw{from{opacity:.35}}
@keyframes dpIn{from{opacity:0}}
#dpOv h2{margin:0;font-size:24px;font-weight:900;color:#ffe9a8;letter-spacing:2px;text-shadow:0 2px 8px #000a}
#dpOv .dps{margin:0;font-size:15px;opacity:.85}
#dpOv .dpr{display:grid;grid-template-columns:repeat(5,auto);gap:min(10px,2.2vw);justify-content:center;perspective:900px}
#dpOv .dpc{width:min(16vw,84px);aspect-ratio:2/3;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1);cursor:pointer;border:0;padding:0;background:none;animation:dpBob 1.6s ease-in-out infinite}
@keyframes dpBob{50%{translate:0 -6px}}
#dpOv.done .dpc{animation:none;cursor:default}
#dpOv .dpc>span{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #0008}
#dpOv .dpb{background:radial-gradient(circle,#ffd54f 0 22%,transparent 23%),repeating-linear-gradient(45deg,#c62828 0 6px,#b71c1c 6px 12px);border:3px solid #ffd54f;font:900 min(8vw,36px) "Noto Sans KR",sans-serif;color:#b71c1c}
#dpOv .dpf{transform:rotateY(180deg);background:linear-gradient(#fffbe6,#ffe082);border:3px solid #ffb300;color:#5d3a00;flex-direction:column;font-weight:900;font-size:min(3.9vw,18px);line-height:1.15}
#dpOv .dpf small{font-size:.6em;font-weight:700;opacity:.7}
#dpOv .dpc.open{transform:rotateY(180deg)}
#dpOv .dpc.mine{scale:1.12;z-index:1}#dpOv .dpc.mine .dpf{box-shadow:0 0 0 4px #fff,0 0 26px 8px #ffd54f}
#dpOv .dpc.other .dpf{filter:grayscale(.7) brightness(.75)}
#dpOv .dpm{min-height:58px;font-size:20px;font-weight:800}
#dpOv .dpm b{color:#ffd54f;font-size:28px}
#dpOv .dpx{border:0;border-radius:999px;padding:12px 40px;font:800 18px "Noto Sans KR",sans-serif;background:linear-gradient(#ffe082,#ffb300);color:#3a2a00;box-shadow:0 6px 16px #0008;cursor:pointer}
#dpOv .dpx[hidden]{display:none}`;document.head.appendChild(st);}
  // 서로 다른 금액 5개 (100만원 단위, 100만~5000만)
  const pool=[...Array(100)].map((_,i)=>(i+1)*1000000);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const amts=pool.slice(0,15),man=v=>v>=100000000?'1억':(v/10000).toLocaleString()+'만';
  const ov=document.createElement('div');ov.id='dpOv';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','오늘의 용돈 카드');
  ov.innerHTML='<h2>🎁 오늘의 용돈 카드</h2><p class="dps">카드 한 장을 골라 보세요 · 100만 ~ 1억원</p><div class="dpr">'+
    amts.map((a,i)=>'<button type="button" class="dpc" data-i="'+i+'" style="animation-delay:-'+(i*0.11).toFixed(2)+'s" aria-label="'+(i+1)+'번 카드"><span class="dpb">?</span><span class="dpf">'+man(a)+'<small>원</small></span></button>').join('')+
    '</div><div class="dpm" aria-live="polite"></div><button type="button" class="dpx" hidden>받기</button>';
  document.body.appendChild(ov);
  const cards=[...ov.querySelectorAll('.dpc')],msg=ov.querySelector('.dpm'),x=ov.querySelector('.dpx');
  ov.querySelector('.dpr').addEventListener('click',e=>{const c=e.target.closest('.dpc');if(!c||ov.classList.contains('done'))return;ov.classList.add('done');
    const bonus=amts[+c.dataset.i];c.classList.add('open','mine');
    const got=WALLET.claimDaily(bonus);
    if(got){try{if(typeof money==='number')money+=got;}catch(_){}}
    setTimeout(()=>{cards.forEach(k=>{if(k!==c)k.classList.add('open','other');});
      const tag=bonus>=100000000?'🎰 최고 당첨! ':bonus>=70000000?'🎉 대박! ':bonus>=40000000?'✨ ':'';
      msg.innerHTML=got?tag+'<b>+'+wonF(bonus)+'</b><br><span style="font-size:15px;opacity:.85">지갑 '+wonF(WALLET.get())+'</span>':'오늘 용돈은 이미 받았어요.';
      x.hidden=false;try{VOICE.say(got?'용돈 '+man(bonus)+' 원':'');}catch(_){}},700);});
  x.onclick=()=>{ov.remove();
    try{if(typeof homeRender==='function')homeRender();}catch(_){}
    try{['smoney','pmoney','gmoney'].forEach(id=>{const el=document.getElementById(id);if(el&&typeof money==='number')el.textContent=wonF(money);});}catch(_){}};
}

/* ---------- 목소리: 휴대폰·PC에 들어 있는 한국어 음성으로 외침 ---------- */
const VOICE={on:FUNLS.get('bgc-voice',true),
  say(t){if(!this.on||!window.speechSynthesis)return;const s=String(t).replace(/<[^>]+>/g,'').replace(/[!~★]/g,'').trim();if(!s)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=1.08;u.pitch=1.15;u.volume=1;
      const v=speechSynthesis.getVoices().find(x=>/^ko/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}},
  set(on){this.on=on;FUNLS.set('bgc-voice',on);}};
if(window.speechSynthesis)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}

/* ---------- 업적 배지 ---------- */
const ACH=(()=>{
  const K='bgc-ach';
  const L={
    gs_win:['🎴','고스톱 첫 승리','고스톱에서 처음 이기기','고스톱'],gs_3go:['🔥','3고 성공','3고 이상 불러서 이기기','고스톱'],gs_chongtong:['👑','총통','처음부터 같은 달 4장','고스톱'],
    gs_5gwang:['🌟','오광','광 5장 모으기','고스톱'],gs_big:['💵','큰 판','고스톱 한 판에 2만원 넘게 따기','고스톱'],

<script>/* ===== 천국코인(HVN): 보드게임 천국 전용 가짜 코인 =====
   시세는 시간으로 정해지는 난수 걸음이라 앱을 꺼 둬도 흘러가고, 다시 열면 같은 흐름을 다시 계산한다. */
const COIN=(()=>{
  const EPOCH=Date.UTC(2026,10,10,15,0,0); // 2026-11-11 00:00 (한국 시간) 상장
  const STEP=5000,BASE=Math.log(10000),SIG=0.0018,REV=0.00003,EVP=1/4000,EVLEN=60;
  const h=(i,s)=>{let x=Math.imul(i^0x9e3779b9,0x85ebca6b)^Math.imul(s+0x632be5,0xc2b2ae35);x^=x>>>16;x=Math.imul(x,0x7feb352d);x^=x>>>15;x=Math.imul(x,0x846ca68b);x^=x>>>16;return (x>>>0)/4294967296;};
  const WHO=['김 사장','이 여사','박 부장','최 선생','정 과장','선(물주)','한 회장','윤 실장'];
  const UPN=[(w,i)=>`🚀 ${w}, 천국코인에 ${2+Math.floor(h(i,3)*90)}억 몰빵!`,w=>`📈 "고스톱 판돈을 천국코인으로 받는다"는 소문에 급등`,w=>`🐋 정체불명 큰손 매수 포착 — ${w}로 추정`,w=>`🌕 ${w}: "천국코인 달까지 간다"`,w=>`🎉 ${w}, 포커 대박 상금으로 천국코인 쓸어 담아`];
  const DNN=[w=>`📉 ${w}, 천국코인 전부 팔았다…`,w=>`😱 ${w} "섯다에서 다 잃었다" 코인 급히 처분`,w=>`🧊 거래소 점검 소문에 급락`,w=>`🐻 곰돌이 등장! 시장에 공포 확산`,w=>`💸 ${w}, 손절하고 화투 치러 떠나`];
  let L=new Float64Array(0),N=-1,events=[],evLeft=0,evDrift=0;
  function stepTo(n){if(n<=N)return;const nl=new Float64Array(Math.max(n+1,L.length*2|0,1024));nl.set(L.subarray(0,N+1));L=nl;
    for(let i=N+1;i<=n;i++){
      if(i===0){L[0]=BASE;events.push({i:0,up:1,t:'🎉 천국코인 상장! 1 HVN = 10,000원에서 출발'});N=0;continue;}
      let p=L[i-1];
      const u1=Math.max(1e-12,h(i,1)),u2=h(i,2);p+=SIG*Math.sqrt(-2*Math.log(u1))*Math.cos(6.283185307*u2)+REV*(BASE-p);
      if(!evLeft&&h(i,7)<EVP){const up=h(i,8)<0.5,mag=0.15+0.35*h(i,9);evDrift=(up?Math.log(1+mag):Math.log(1-mag*0.8))/EVLEN;evLeft=EVLEN;
        const w=WHO[Math.floor(h(i,10)*WHO.length)],pool=up?UPN:DNN;events.push({i,up:up?1:0,mag,t:pool[Math.floor(h(i,11)*pool.length)](w,i)});}
      if(evLeft){p+=evDrift;evLeft--;}
      L[i]=p;}
    N=n;}
  const nowStep=()=>Math.max(0,Math.floor((Date.now()-EPOCH)/STEP));
  const price=i=>Math.exp(L[Math.max(0,Math.min(N,i))]);
  const timeOf=i=>EPOCH+i*STEP;
  return{EPOCH,STEP,h,WHO,stepTo,nowStep,price,timeOf,get N(){return N;},get events(){return events;}};
})();

    $('rank').innerHTML=list.slice(0,6).concat(list.slice(0,6).some(x=>x.me)?[]:[list.find(x=>x.me)]).map((x,k)=>'<li><span class="av" style="background:'+x.c+'">'+(x.me?'⭐':x.w[0])+'</span><span class="nm'+(x.me?' me':'')+'">'+(list.indexOf(x)+1)+'. '+x.w+'</span><b>'+fmtQ(x.q)+'</b></li>').join('');
    est();draw();}
  function est(){const v=+($('amt').value.replace(/[^0-9.]/g,''))||0,p=COIN.price(COIN.N);
    $('est').textContent=v?(tab==='buy'?'≈ '+fmtQ(v/p)+' 받아요':'≈ '+wonF(v*p)+' 받아요'):'';}
  document.querySelector('.rng').onclick=e=>{const b=e.target.closest('button');if(!b)return;range=b.dataset.r;document.querySelectorAll('.rng button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();};
  document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    $('go').className='go '+tab;$('go').textContent=tab==='buy'?'사기':'팔기';$('unit').textContent=tab==='buy'?'원':'HVN';$('amt').value='';est();};
  document.querySelector('.quick').onclick=e=>{const b=e.target.closest('button');if(!b)return;const f=+b.dataset.q;
    $('amt').value=tab==='buy'?Math.floor(WALLET.get()*f).toLocaleString():(f===1?hold().q:Math.floor(hold().q*f*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});est();};
  $('amt').oninput=()=>{if(tab==='buy'){const v=$('amt').value.replace(/[^0-9]/g,'');$('amt').value=v?(+v).toLocaleString():'';}est();};
  $('go').onclick=()=>{const v=+($('amt').value.replace(/[^0-9.]/g,''))||0,p=COIN.price(COIN.N),H=hold();if(!v)return;
    if(tab==='buy'){if(v>WALLET.get()){funToast('지갑에 돈이 모자라요');return;}WALLET.set(WALLET.get()-v);H.q+=v/p;H.cost+=v;FUNLS.set(K,H);if(v>=1e9)addMyNews('🐋 '+nick()+', 천국코인 '+big(v)+'어치 매수! 큰손 등장',1);funToast('🪙 <b>'+fmtQ(v/p)+'</b> 샀어요 ('+wonF(v)+')');}
    else{const q=Math.min(v,H.q);if(q<=0){funToast('팔 코인이 없어요');return;}const won=Math.round(q*p);H.cost*=1-q/H.q;H.q-=q;if(H.q<1e-6){H.q=0;H.cost=0;}FUNLS.set(K,H);WALLET.set(WALLET.get()+won);
      if(won>=1e9)addMyNews('💼 '+nick()+', 천국코인 '+big(won)+'어치 매도… 차익 실현?',0);funToast('💰 <b>'+fmtQ(q)+'</b> 팔아서 <b>'+wonF(won)+'</b> 받았어요');}
    $('amt').value='';render();};
  const nf=$('nickF');
  $('nickB').onclick=()=>{nf.hidden=!nf.hidden;if(!nf.hidden){$('nickI').value=FUNLS.get('bgc-nick','');$('nickI').focus();}};
  nf.onsubmit=e=>{e.preventDefault();const v=$('nickI').value.trim().slice(0,10);FUNLS.set('bgc-nick',v);nf.hidden=true;funToast(v?'이름을 <b>'+v.replace(/[<>&]/g,'')+'</b>(으)로 정했어요':'이름을 지웠어요');render();};
  addEventListener('bgc-nick',()=>render());
  COIN.stepTo(COIN.nowStep());render();
  setInterval(()=>{const n=COIN.nowStep();if(n>COIN.N){COIN.stepTo(n);render();}},1000);
  addEventListener('resize',draw);
})();
</script>

  document.getElementById('swNow').onclick=function(){document.getElementById('swMsg').textContent='바꾸는 중…';w.postMessage('SKIP');};
  document.getElementById('swLater').onclick=function(){b.hidden=true;};}
addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(reg){
  if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
  reg.addEventListener('updatefound',function(){var w=reg.installing;if(w)w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)show(w);});});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){});});
}).catch(function(){});});})();</script>
