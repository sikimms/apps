<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보드게임">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>첫 고스톱 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽 판, 오른쪽 수업 노트/대국 패널 — 좁은 화면에선 위아래로 쌓임 */
:root{
  --bg:#eceeea; --surface:#f9faf8; --ink:#1d2320; --muted:#5b6661; --rule:#d3d9d4;
  --accent:#2d6a4f; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --danger:#b3362c; --danger-soft:#f6e1de; --ok:#2b7a47; --ok-soft:#dff0e4;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1b211e; --ink:#e4eae6; --muted:#98a59e; --rule:#2c3631;
  --accent:#74c49b; --accent-ink:#0e1411; --accent-soft:#22342a;
  --danger:#ff8074; --danger-soft:#3a201d; --ok:#83d6a1; --ok-soft:#1d3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1b211e; --ink:#e4eae6; --muted:#98a59e; --rule:#2c3631;
  --accent:#74c49b; --accent-ink:#0e1411; --accent-soft:#22342a;
  --danger:#ff8074; --danger-soft:#3a201d; --ok:#83d6a1; --ok-soft:#1d3326; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.boardbox{background:var(--frame);padding:6px;border-radius:10px;box-shadow:0 10px 30px -18px rgba(0,0,0,.55);max-width:560px;width:100%;margin:0 auto}
svg.board{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation;user-select:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.done::after{content:" ✓"}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h2{font-family:var(--f-display);font-size:24px;margin:2px 0 10px;text-wrap:balance}
.text{max-width:62ch}
.text b{color:var(--accent)}
.turn{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;margin:12px 0 4px}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:14.5px}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--danger-soft);border-left:4px solid var(--danger)}
.fb.info{background:var(--accent-soft);border-left:4px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:500 14px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quiz{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.stat.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat .n{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;font-size:14px}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
select{font:14px var(--f-body);padding:4px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.tips{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px;font-size:13.5px;color:var(--muted)}
.tips ul{margin:6px 0 0;padding-left:18px}
.result{font-variant-numeric:tabular-nums}
.rankcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.rank{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.rank small{font-size:15px;color:var(--muted);font-weight:400;margin-left:6px;font-family:var(--f-body)}
.sub{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font:13px var(--f-body);text-decoration:underline;cursor:pointer;padding:2px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.lv{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;font:500 15px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:1px}
.lv span{font-size:11.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.lv[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.lv:disabled{opacity:.4;cursor:not-allowed}
.wbar{height:10px;border-radius:5px;background:var(--bar-b);box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden;margin-top:4px}
.wbar span{display:block;height:100%;background:var(--bar-a);transition:width .4s}
.wrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
.tag.g{background:var(--ok-soft);color:var(--ok)} .tag.m{background:var(--accent-soft);color:var(--accent)}
.tag.s{background:var(--danger-soft);color:var(--danger)} .tag.b{background:var(--danger);color:var(--surface)}
.hist{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px dashed var(--rule)}
.thinking::after{content:"";display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none}}
.rv{border:0;cursor:pointer;font-family:inherit;line-height:1.6}
.rv:hover{text-decoration:underline}
.rvlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(8,12,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:460px;max-height:100%;overflow:auto;padding:18px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.rvhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rvhead h2{font-size:20px;margin:2px 0 10px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet .boardbox{max-width:min(420px,52vh)}
.sheet svg.board{cursor:default}
.legend{font-size:13px;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.lg{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c)}
.lg.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.boardcol{min-width:0;max-width:560px;width:100%;margin:0 auto}
.b3d{width:100%;aspect-ratio:var(--b3d-ratio,1);border-radius:6px;background:radial-gradient(ellipse at 50% 35%,var(--surface),var(--bg));overflow:hidden}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.btn.sm{padding:5px 11px;font-size:13px}
.pk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pk button{font:500 16px var(--f-body);padding:10px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.pk button:hover{border-color:var(--accent)}
#rvEyebrow{text-transform:none;letter-spacing:0}

/* 고스톱 전용 */
:root{--frame:#3b2414;--accent:#b3261e;--accent-soft:#f6dedb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f28b82;--accent-soft:#3a201d;--accent-ink:#1a0d0b}}
:root[data-theme="dark"]{--accent:#f28b82;--accent-soft:#3a201d;--accent-ink:#1a0d0b}
.gtable{position:relative;width:100%;border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.10),rgba(0,0,0,0) 55%),radial-gradient(ellipse at 50% 50%,#2c8053 0%,#1d5e3b 55%,#123a25 100%);
  box-shadow:inset 0 0 0 7px #6b3d1c,inset 0 0 0 9px #a8723f,inset 0 0 0 12px #4a2810,inset 0 0 60px rgba(0,0,0,.55),0 16px 36px -18px rgba(0,0,0,.75)}
.gtable::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.4px),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.4px);background-size:4px 4px,7px 7px;background-position:0 0,2px 3px;pointer-events:none}
.gcard{position:absolute;left:0;top:0;transition:transform .42s cubic-bezier(.2,.75,.25,1),width .3s,height .3s,filter .2s;will-change:transform;perspective:600px}
.gcard .gin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s ease}
.gcard.down .gin{transform:rotateY(180deg)}
.gcard .gf,.gcard .gb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%;box-shadow:0 2px 4px rgba(0,0,0,.45)}
.gcard .gb{transform:rotateY(180deg)}
.gcard svg{display:block;width:100%;height:100%}
.gcard.can{cursor:pointer}
.gcard.can:hover{filter:brightness(1.08)}
.gcard.can:hover .gf{box-shadow:0 0 0 2px #ffd34d,0 6px 12px rgba(0,0,0,.5)}
.gcard.hl .gf{box-shadow:0 0 0 3px #ffd34d,0 0 14px 3px rgba(255,211,77,.8)}
.gcard.sel .gf{box-shadow:0 0 0 3px #4fc3f7,0 0 14px 3px rgba(79,195,247,.8)}
.gcard.dim{filter:brightness(.55)}
.glabel{position:absolute;font:700 11px var(--f-body);color:#e9f5ec;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
.glabel b{color:#ffd34d}
.glabel.turn{color:#ffd34d}
.gdeckn{position:absolute;font:800 12px var(--f-body);color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:1px 7px;pointer-events:none}

.gover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,15,10,.55);z-index:600;padding:12px}
.gbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:16px 18px;max-width:380px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);max-height:100%;overflow:auto}
.gbox h3{margin:0 0 6px;font:700 20px var(--f-display)}
.gbox .gbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gbox .gbtns .btn{flex:1;font-size:16px;padding:10px}
.gpick{display:flex;gap:10px;justify-content:center;margin-top:8px}
.gpick button{border:0;background:none;padding:0;cursor:pointer;width:76px;border-radius:8px}
.gpick button:hover{outline:3px solid #ffd34d}
.gpick svg{display:block;width:100%;height:auto}
.gscore{display:grid;gap:8px;margin-bottom:12px}
.gsc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px}
.gsc.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gsc .gn{font-weight:700;font-size:14px}.gsc .gp{float:right;font:700 16px var(--f-display);color:var(--accent)}
.gsc .gd{color:var(--muted);font-size:12px;margin-top:2px}
.gmoney{font:700 13px var(--f-body);color:var(--muted)}
.gres td{padding:2px 6px;font-size:13.5px}.gres td:last-child{text-align:right;font-weight:700}
.gflip{margin-top:6px}

.gcard .gf,.gcard .gb{box-shadow:0 1px 1px rgba(0,0,0,.35),0 4px 8px -2px rgba(0,0,0,.45)}
.gcard.eat .gf{box-shadow:0 0 0 2.5px #ffcc33,0 0 12px 2px rgba(255,204,51,.75),0 6px 10px -2px rgba(0,0,0,.5)}
.gcard.eat::after{content:"";position:absolute;left:50%;bottom:-7px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#ffcc33;box-shadow:0 0 6px #ffcc33}
.glabel{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;backdrop-filter:blur(2px)}
.gdeckn{box-shadow:0 1px 3px rgba(0,0,0,.5)}

.gmat{position:absolute;border-radius:50%/40%;background:radial-gradient(ellipse at center,rgba(255,255,255,.07),rgba(255,255,255,0) 70%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);pointer-events:none;z-index:1}
.gplate{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.15);z-index:450;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.gplate.turn{border-color:#ffcc33;box-shadow:0 0 0 2px rgba(255,204,51,.5),0 0 16px rgba(255,204,51,.6)}
.gplate .gav{width:24px;height:24px;flex:none}
.gplate .gpn{display:flex;flex-direction:column;line-height:1.1}.gplate .gpn b{color:#fff;font-size:12px}.gplate .gpn small{color:#cfe8d6;font-size:10px;font-weight:500}
.gplate .gpt{font:900 18px var(--f-display);color:#ffd34d;margin-left:4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}.gplate .gpt small{font-size:10px;margin-left:1px}
.gtag{font:800 10px var(--f-body);padding:1px 6px;border-radius:999px;margin-left:2px}.gtag.go{background:#e53935;color:#fff}.gtag.mul{background:#ffcc33;color:#3a2a00}
.gcnt{position:absolute;font:800 10px var(--f-body);color:#fff;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.45);pointer-events:none;z-index:420;white-space:nowrap;line-height:14px}
.gcnt-gwang{background:#c62828}.gcnt-yeol{background:#1565c0}.gcnt-tti{background:#6a1b9a}.gcnt-pi{background:#455a64}
.gbang{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;z-index:500;transition:opacity .2s,transform .45s cubic-bezier(.18,1.8,.4,1)}
.gbang.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.gbtxt{position:relative;display:block;font:900 52px var(--f-display);white-space:nowrap;letter-spacing:2px;
  background:linear-gradient(180deg,#fff7c2 0%,#ffd34d 45%,#ff8f00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #6d1010;filter:drop-shadow(0 4px 0 #6d1010) drop-shadow(0 0 16px rgba(255,150,40,.8))}
.gburst{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,220,90,.55) 0 10deg,rgba(255,220,90,0) 10deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:gspin 1.2s linear}
@keyframes gspin{from{transform:rotate(0) scale(.6)}to{transform:rotate(60deg) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.gburst{animation:none}}

.gpass{position:absolute;left:0;top:0;z-index:330;border-radius:7%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:repeating-linear-gradient(45deg,#3b2a12 0 6px,#4a3517 6px 12px);border:2px dashed #ffcc33;color:#ffe08a;font:800 12px var(--f-body);
  box-shadow:0 4px 8px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.75,.25,1)}
.gpass b{font:900 15px var(--f-display);color:#ff7043}
.gpass.can{cursor:pointer;box-shadow:0 0 0 2px #ffcc33,0 0 14px rgba(255,204,51,.7)}
.gpass[hidden]{display:none!important}

</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>첫 고스톱 교실<small>화투 그림 알아보기부터 쪽·뻑·고/스톱까지 직접 쳐 보면서 배워요. 맞고(2명)와 3명 고스톱. 가짜 돈으로만 해요.</small></h1>
    <div class="tabs" role="tablist"><button id="tabLearn" role="tab" aria-selected="true">배우기</button><button id="tabPlay" role="tab" aria-selected="false">실전</button></div>
  </header>
  <section id="learn" class="grid">
    <div class="boardcol"><div class="gtable" id="ltable" aria-label="연습용 판"></div></div>
    <div class="panel">
      <div class="chips" id="lchips"></div>
      <div class="eyebrow" id="lstep"></div>
      <h2 id="ltitle"></h2>
      <div class="text" id="ltext"></div>
      <div id="lquiz"></div><div id="lfb"></div>
      <div class="row"><button class="btn" id="lreset">다시 하기</button><button class="btn primary" id="lnext">다음</button></div>
    </div>
  </section>
  <section id="play" class="grid" hidden>
    <div class="boardcol"><div class="gtable" id="gtable" aria-label="고스톱 판"></div>
      <div class="viewbar"><button class="btn sm" id="flipOnly" hidden>뒤집기만 하기</button><span class="gmoney" id="gmoney"></span></div></div>
    <div class="panel">
      <div class="gscore" id="gscore"></div>
      <div id="gmsg" class="fb info"></div>
      <div class="row"><button class="btn primary" id="gNew">새 판</button></div>
      <div class="eyebrow" style="margin:16px 0 6px">컴퓨터 등급</div>
      <div class="levels" id="glevels" role="radiogroup" aria-label="컴퓨터 등급"></div>
      <div class="sub" id="grec"></div>
      <div class="opts">
        <label>인원 <select id="gPlayers"><option value="2">2명 (맞고)</option><option value="3">3명 고스톱</option></select></label>
        <label><input type="checkbox" id="gLabels"> 카드에 달·종류 표시</label>
        <label><input type="checkbox" id="gSound"> 소리</label>
      </div>
      <div class="tips"><strong>치는 법</strong><ul>
        <li>손패를 누르면 내요. 손패에 마우스를 올리면 바닥의 같은 달 패가 반짝여요.</li>
        <li>같은 달이 바닥에 2장이면 어느 것을 먹을지 물어봐요.</li>
        <li>맞고는 7점, 3명은 3점이 넘으면 고/스톱을 고를 수 있어요.</li>
        <li>점수와 돈은 모두 가짜예요. 1점 = 100원. <button class="linkbtn" id="gReset">돈·기록 처음으로</button></li>
      </ul></div>
    </div>
  </section>
</div>
<script>
/* ===== 고스톱 규칙 (맞고 2명 / 3명) =====
   2명: 10장씩, 바닥 8장, 7점부터 고/스톱.  3명: 7장씩, 바닥 6장, 3점부터 고/스톱.
   화투 48장: 달(1~12) × 4장. 카드 번호 id = (달-1)*4 + 순서.
   한 사람 10장, 바닥 8장, 더미 20장. 손에서 한 장 내고 더미에서 한 장 뒤집어 같은 달끼리 먹는다.
   7점이 나면 고(계속) 또는 스톱(끝내기). */
const GS=(()=>{
const G='gwang',Y='yeol',T='tti',P='pi';
// 달별 4장: [종류, 띠 종류 또는 특징]
const TABLE={
  1:[[G],[T,'hong'],[P],[P]],
  2:[[Y,'bird'],[T,'hong'],[P],[P]],
  3:[[G],[T,'hong'],[P],[P]],
  4:[[Y,'bird'],[T,'cho'],[P],[P]],
  5:[[Y],[T,'cho'],[P],[P]],
  6:[[Y],[T,'cheong'],[P],[P]],
  7:[[Y],[T,'cho'],[P],[P]],
  8:[[G],[Y,'bird'],[P],[P]],
  9:[[Y,'gukjin'],[T,'cheong'],[P],[P]],
  10:[[Y],[T,'cheong'],[P],[P]],
  11:[[G],[P,'ssang'],[P],[P]],
  12:[[G,'bi'],[Y],[T,'bi'],[P,'ssang']]};
const MONTH=['','송학','매조','벚꽃','흑싸리','난초','모란','홍싸리','공산','국진','단풍','오동','비'];
const CARDS=[];
for(let m=1;m<=12;m++)TABLE[m].forEach(([t,x],i)=>CARDS.push({id:(m-1)*4+i,m,t,x:x||null,pi:t===P?(x==='ssang'?2:1):0}));
const monthOf=id=>(id>>2)+1;
const TNAME={gwang:'광',yeol:'열끗',tti:'띠',pi:'피'};
function cardName(id){const c=CARDS[id];
  if(c.t===G)return `${c.m}월 ${c.x==='bi'?'비광':'광'}`;
  if(c.t===Y)return `${c.m}월 열끗${c.x==='bird'?'(새)':c.x==='gukjin'?'(국진)':''}`;
  if(c.t===T)return `${c.m}월 ${c.x==='hong'?'홍단':c.x==='cheong'?'청단':c.x==='cho'?'초단':''}띠`;
  return `${c.m}월 ${c.pi===2?'쌍피':'피'}`;}

/* ---------- 점수 ---------- */
// 9월 국진은 열끗 또는 쌍피 중 유리한 쪽으로 센다
function scoreOf(caps,opts={}){
  const best=[false,true].map(gukAsPi=>scoreRaw(caps,gukAsPi)).sort((a,b)=>b.total-a.total)[0];
  return best;
}
function scoreRaw(caps,gukAsPi){
  const cs=caps.map(id=>CARDS[id]);
  const gw=cs.filter(c=>c.t===G),hasBi=gw.some(c=>c.x==='bi');
  let yeol=cs.filter(c=>c.t===Y),tti=cs.filter(c=>c.t===T);
  let piN=cs.filter(c=>c.t===P).reduce((a,c)=>a+c.pi,0);
  if(gukAsPi&&yeol.some(c=>c.x==='gukjin')){yeol=yeol.filter(c=>c.x!=='gukjin');piN+=2;}
  const parts=[];let total=0;
  const add=(name,pt)=>{if(pt>0){parts.push([name,pt]);total+=pt;}};
  const g=gw.length;
  add(g===5?'5광':g===4?'4광':g===3?(hasBi?'비 3광':'3광'):'',g===5?15:g===4?4:g===3?(hasBi?2:3):0);
  const birds=yeol.filter(c=>c.x==='bird').length;
  add('고도리',birds===3?5:0);
  add(`열끗 ${yeol.length}장`,yeol.length>=5?yeol.length-4:0);
  const hong=tti.filter(c=>c.x==='hong').length,cheong=tti.filter(c=>c.x==='cheong').length,cho=tti.filter(c=>c.x==='cho').length;
  add('홍단',hong===3?3:0);add('청단',cheong===3?3:0);add('초단',cho===3?3:0);
  add(`띠 ${tti.length}장`,tti.length>=5?tti.length-4:0);
  add(`피 ${piN}장`,piN>=10?piN-9:0);
  return{total,parts,gwang:g,yeol:yeol.length,tti:tti.length,pi:piN,piScore:piN>=10,gwangScore:g>=3,gukAsPi};
}
const piCount=caps=>scoreOf(caps).pi;

/* ---------- 판 시작 ---------- */
function shuffle(a,rnd=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newRound(o={}){
  const n=o.players===3?3:2,hn=n===3?7:10,fn=n===3?6:8;
  for(let tries=0;tries<50;tries++){
    const d=shuffle([...Array(48).keys()],o.rnd),A=k=>Array.from({length:n},()=>k());
    const hands=Array.from({length:n},(_,i)=>d.slice(i*hn,(i+1)*hn));
    const s={n,need:n===3?3:7,hands,floor:d.slice(n*hn,n*hn+fn),deck:d.slice(n*hn+fn),caps:A(()=>[]),
      turn:o.first||0,go:A(()=>0),goScore:A(()=>0),mult:A(()=>1),shook:A(()=>[]),bombPass:A(()=>0),ppeok:{},nagari:o.nagari||1,
      over:false,winner:-1,log:[],last:null};
    // 바닥에 같은 달 4장이면 다시 섞기
    const fm={};s.floor.forEach(id=>fm[monthOf(id)]=(fm[monthOf(id)]||0)+1);
    if(Object.values(fm).some(n=>n===4))continue;
    s.hands.forEach(h=>h.sort((a,b)=>a-b));
    // 총통: 손에 같은 달 4장이면 바로 승리
    for(let p=0;p<s.n;p++){const hm={};s.hands[p].forEach(id=>hm[monthOf(id)]=(hm[monthOf(id)]||0)+1);
      const m=Object.keys(hm).find(k=>hm[k]===4);if(m){s.over=true;s.winner=p;s.chongtong=+m;s.final=settle(s,p);return s;}}
    return s;
  }
  throw new Error('deal failed');
}
const clone=s=>JSON.parse(JSON.stringify(s));
const sameMonth=(list,m)=>list.filter(id=>monthOf(id)===m);

/* ---------- 내기 전에 고를 수 있는 것 ---------- */
// 손패의 달별 장수
function handMonths(s,p){const hm={};s.hands[p].forEach(id=>hm[monthOf(id)]=(hm[monthOf(id)]||0)+1);return hm;}
// 낼 수 있는 수: {card} 보통, {card,bomb:true} 폭탄(같은 달 3장 + 바닥 1장), {flipOnly:true} 폭탄 뒤 뒤집기만
function moves(s,p=s.turn){
  const out=[],hm=handMonths(s,p);
  for(const id of s.hands[p]){const m=monthOf(id),fl=sameMonth(s.floor,m).length;
    if(hm[m]===3&&fl===1){if(!out.some(x=>x.bomb&&monthOf(x.card)===m))out.push({card:id,bomb:true});}
    out.push({card:id,shake:hm[m]===3&&fl===0&&!s.shook[p].includes(m)});}
  if(s.bombPass[p]>0)out.push({flipOnly:true});
  return out;
}

/* ---------- 한 차례 진행 ----------
   pick(choices,kind): 바닥에 같은 달이 2장일 때 무엇을 먹을지 고르는 함수 (사람은 화면에서, 컴퓨터는 판단으로)
   결과: 이벤트 목록 (화면 연출용) */
function playTurn(s,mv,pick){
  const p=s.turn,ev=[],taken=[];let steal=0;
  const take=ids=>{for(const id of ids){s.floor=s.floor.filter(x=>x!==id);taken.push(id);}};
  let played=null,pend=null;   // pend: 손패로 1장 맞춘 것(뒤집은 패를 보고 확정)
  if(mv.bomb){
    const m=monthOf(mv.card),mine=sameMonth(s.hands[p],m);s.hands[p]=s.hands[p].filter(x=>monthOf(x)!==m);
    ev.push({k:'bomb',p,cards:mine,m});take(sameMonth(s.floor,m));taken.push(...mine);steal++;s.mult[p]*=2;s.bombPass[p]+=2;s.shook[p].push(m);
  }else if(mv.flipOnly){s.bombPass[p]--;ev.push({k:'pass',p});}
  else{
    played=mv.card;const m=monthOf(played);s.hands[p]=s.hands[p].filter(x=>x!==played);
    if(mv.shake){s.mult[p]*=2;s.shook[p].push(m);ev.push({k:'shake',p,m,cards:sameMonth(s.hands[p],m).concat(played)});}
    const fm=sameMonth(s.floor,m);ev.push({k:'play',p,card:played,match:fm.slice()});
    if(fm.length===3){take(fm);taken.push(played);played=null;if(s.ppeok[m]!=null){steal+=s.ppeok[m]===p?2:1;ev.push({k:'ppeokEat',p,m});delete s.ppeok[m];}else ev.push({k:'four',p,m});}
    else if(fm.length===2){pend={played,with:pick(fm,'play'),pair:fm};}
    else if(fm.length===1){pend={played,with:fm[0]};}
    if(fm.length!==3)s.floor.push(played);   // 일단 바닥에 놓음 (먹으면 아래에서 가져감). 4장 다 먹은 경우는 이미 가져감
  }
  // 뒤집기
  if(s.deck.length){
    const f=s.deck.shift(),fmn=monthOf(f);ev.push({k:'flip',p,card:f});
    if(played!=null&&fmn===monthOf(played)){
      const m=fmn;
      if(!pend){take([played,f].filter(x=>x!==f));taken.push(f);steal++;ev.push({k:'jjok',p,m});}                 // 쪽
      else if(pend.pair){take([played,...pend.pair]);taken.push(f);steal++;ev.push({k:'ttadak',p,m});pend=null;}  // 따닥
      else{s.floor.push(f);s.ppeok[m]=p;ev.push({k:'ppeok',p,m});pend=null;}                                     // 뻑
    }else{
      const fm=sameMonth(s.floor,fmn).filter(x=>!pend||(x!==pend.played&&x!==pend.with));
      if(fm.length===3){take(fm);taken.push(f);if(s.ppeok[fmn]!=null){steal+=s.ppeok[fmn]===p?2:1;ev.push({k:'ppeokEat',p,m:fmn});delete s.ppeok[fmn];}else ev.push({k:'four',p,m:fmn});}
      else if(fm.length===2){const w=pick(fm,'flip');take([w]);taken.push(f);}
      else if(fm.length===1){take(fm);taken.push(f);}
      else s.floor.push(f);
    }
  }
  if(pend){take([pend.played,pend.with]);}
  // 쓸: 바닥을 다 쓸어감 (마지막 판은 제외)
  if(taken.length&&!s.floor.length&&s.deck.length){steal++;ev.push({k:'sseul',p});}
  s.caps[p].push(...taken);
  for(let o=0;o<s.n;o++){if(o===p)continue;   // 쪽·따닥·쓸 등: 다른 사람 모두에게서 피를 받음
    for(let i=0;i<steal;i++){const id=stealPi(s,o);if(id==null)break;s.caps[o]=s.caps[o].filter(x=>x!==id);s.caps[p].push(id);ev.push({k:'steal',p,from:o,card:id});}}
  ev.push({k:'take',p,cards:taken});
  s.last={p,taken,played};
  return ev;
}
// 상대에게서 가져올 피: 그냥 피 먼저, 없으면 쌍피
function stealPi(s,o){const pis=s.caps[o].filter(id=>CARDS[id].t===P).sort((a,b)=>CARDS[a].pi-CARDS[b].pi);return pis.length?pis[0]:null;}

/* ---------- 차례 끝: 고/스톱 판단이 필요한지 ---------- */
function afterTurn(s){
  const p=s.turn,sc=scoreOf(s.caps[p]).total;
  if(sc>=s.need&&sc>s.goScore[p]){
    const canGo=s.hands[p].length>0||s.bombPass[p]>0;
    if(!canGo){finish(s,p);return'stop';}
    return'ask';}
  return endOrNext(s);
}
function endOrNext(s){
  const has=p=>s.hands[p].length||s.bombPass[p];
  if(!s.hands.some((_,p)=>has(p))){s.over=true;s.winner=-1;s.nagariNext=s.nagari*2;return'nagari';}
  for(let k=1;k<=s.n;k++){const q=(s.turn+k)%s.n;if(has(q)){s.turn=q;break;}}
  return'next';
}
function declareGo(s){const p=s.turn;s.go[p]++;s.goScore[p]=scoreOf(s.caps[p]).total;s.log.push(`${p}:go${s.go[p]}`);return endOrNext(s);}
function finish(s,p){s.over=true;s.winner=p;s.final=settle(s,p);}
// 최종 점수: 기본 점수 + 고 점수, 배수(3고부터 2배씩, 흔들기·폭탄, 멍따, 광박, 피박, 나가리)
function settle(s,p){
  const me=scoreOf(s.caps[p]),losers=[...Array(s.n).keys()].filter(q=>q!==p);
  if(s.chongtong){const t=10*s.nagari;return{base:10,go:0,mul:s.nagari,total:t*losers.length,notes:[`총통 (${s.chongtong}월 4장)`].concat(s.nagari>1?[`나가리 ×${s.nagari}`]:[]),parts:[],pay:losers.map(q=>({q,amt:t,notes:[]}))};}
  const notes=[];let base=me.total,mul=1;const go=s.go[p];
  if(go)notes.push(`${go}고 +${go}`);
  if(go>=3){const k=2**(go-2);mul*=k;notes.push(`${go}고 ×${k}`);}
  if(s.mult[p]>1){mul*=s.mult[p];notes.push(`흔들기·폭탄 ×${s.mult[p]}`);}
  if(me.yeol>=7){mul*=2;notes.push('멍따(열끗 7장↑) ×2');}
  if(s.nagari>1){mul*=s.nagari;notes.push(`나가리 ×${s.nagari}`);}
  // 진 사람마다: 광박·피박
  let pay=losers.map(q=>{const op=scoreOf(s.caps[q]),pn=[];let m=1;
    if(me.gwangScore&&op.gwang===0){m*=2;pn.push('광박 ×2');}
    if(me.piScore&&op.pi<(s.n===3?6:7)){m*=2;pn.push('피박 ×2');}
    return{q,amt:(base+go)*mul*m,notes:pn};});
  // 고박: 고를 불렀다가 진 사람이 진 사람들 몫을 혼자 냄 (3명일 때)
  const goLoser=pay.find(x=>s.go[x.q]>0);
  if(goLoser&&s.n>2){const sum=pay.reduce((a,x)=>a+x.amt,0);pay=pay.map(x=>({...x,amt:x.q===goLoser.q?sum:0,notes:x.q===goLoser.q?x.notes.concat('고박 (혼자 다 냄)'):x.notes.concat('고박으로 면제')}));}
  const total=pay.reduce((a,x)=>a+x.amt,0);
  return{base,go,mul,total,notes,parts:me.parts,pay};
}

/* ---------- 컴퓨터 ---------- */
// 카드 하나의 가치: 내 점수에 얼마나 보탬이 되는지(가까워진 족보 포함)
function capValue(caps,ids){
  const before=potential(caps),after=potential(caps.concat(ids));return after-before;
}
function potential(caps){
  const sc=scoreOf(caps),cs=caps.map(id=>CARDS[id]);
  let v=sc.total*10;
  const g=sc.gwang;v+=[0,2,6,0,0,0][g]||0;
  const birds=cs.filter(c=>c.x==='bird').length;if(birds===2)v+=8;
  for(const t of ['hong','cheong','cho']){const n=cs.filter(c=>c.x===t).length;if(n===2)v+=7;else if(n===1)v+=1;}
  v+=Math.min(sc.yeol,4)*1.2+Math.min(sc.tti,4)*1.0+Math.min(sc.pi,9)*0.9;
  return v;
}
// 다른 사람이 볼 수 없는 패(더미·상대 손)를 섞어서 시뮬레이션
function determinize(s,p,rnd=Math.random){
  const t=clone(s),others=[...Array(t.n).keys()].filter(q=>q!==p);
  let unknown=shuffle(t.deck.concat(...others.map(q=>t.hands[q])),rnd);
  for(const q of others){const k=t.hands[q].length;t.hands[q]=unknown.slice(0,k);unknown=unknown.slice(k);}t.deck=unknown;return t;
}
function greedyPick(s,p){return (list)=>list.slice().sort((a,b)=>capValue(s.caps[p],[b])-capValue(s.caps[p],[a]))[0];}
// 한 수를 해 보고 얻는 점수 변화 (상대에게 준 피도 감안)
function evalMove(s,mv,p,rnd){
  const t=clone(s);t.turn=p;const others=[...Array(t.n).keys()].filter(q=>q!==p);
  const before=potential(t.caps[p]),ob=others.map(q=>potential(t.caps[q]));
  playTurn(t,mv,greedyPick(t,p));
  let v=potential(t.caps[p])-before;others.forEach((q,i)=>v-=(potential(t.caps[q])-ob[i])*0.9);
  // 바닥에 남긴 패를 다음 사람이 쉽게 먹을 수 있으면 감점
  const nx=(p+1)%t.n,oh=t.hands[nx];for(const id of t.floor){if(oh.some(x=>monthOf(x)===monthOf(id)))v-=capValue(t.caps[nx],[id])*0.35;}
  return v;
}
const LEVELS=[
  {name:'신입',choose(s,p){let ms=moves(s,p).filter(m=>!m.flipOnly);if(!ms.length)ms=moves(s,p);return Math.random()<0.6?ms[Math.floor(Math.random()*ms.length)]:bestBy(s,p,ms,1);},go:(s,p)=>Math.random()<0.5},
  {name:'초보',choose(s,p){return bestBy(s,p,moves(s,p),3);},go:(s,p)=>Math.max(...s.caps.map((c,q)=>q===p?0:scoreOf(c).total))<s.need-4&&s.deck.length>8},
  {name:'중수',choose(s,p){return bestBy(s,p,moves(s,p),12);},go:goJudge},
  {name:'고수',choose(s,p){return bestBy(s,p,moves(s,p),40);},go:goJudge}
];
function bestBy(s,p,ms,samples,simple){
  let best=null,bv=-1e9;
  for(const mv of ms){let v=0;
    if(simple){const t=determinize(s,p);t.turn=p;const b=t.caps[p].length;playTurn(t,mv,greedyPick(t,p));v=t.caps[p].length-b;}
    else for(let k=0;k<samples;k++)v+=evalMove(determinize(s,p),mv,p);
    if(mv.shake)v+=samples*1.5;if(mv.bomb)v+=samples*6;
    if(v>bv){bv=v;best=mv;}}
  return best;
}
// 고 판단: 상대가 거의 못 냈고 패가 남아 있으면 고
function goJudge(s,p){
  const left=s.hands[p].length;if(left<=1)return false;
  let danger=-9;for(let q=0;q<s.n;q++){if(q===p)continue;const os=scoreOf(s.caps[q]);danger=Math.max(danger,os.total+(os.pi>=8?1:0)+(os.gwang>=2?1:0)-(s.need-3));}
  if(s.go[p]>=2&&danger>=0)return false;
  return danger<=0&&left>=3;
}
return{CARDS,MONTH,TNAME,monthOf,cardName,scoreOf,piCount,newRound,clone,moves,playTurn,afterTurn,declareGo,finish,endOrNext,settle,
  potential,capValue,greedyPick,LEVELS,handMonths,sameMonth};
})();

/* ===== 화투 그림 (SVG로 직접 그림) =====
   실제 화투처럼: 굵은 검은 윤곽선, 그러데이션, 종이 질감, 카드 광택.
   viewBox 0 0 60 92. 초보용으로 왼쪽 위에 달 숫자, 오른쪽 위에 종류 표시. */
const HW=(()=>{
const W=60,H=92,K='#151515';
const sum=(...a)=>a.join('');
const S=(sw=1)=>` stroke="${K}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;

async function animateTurn(T,s,mv,pick,o){
  const before=GS.clone(s),p=s.turn,fast=o.fast||1,tmp=GS.clone(before);
  if(mv.bomb){const m=monthOf(mv.card);const mine=tmp.hands[p].filter(x=>monthOf(x)===m);tmp.hands[p]=tmp.hands[p].filter(x=>monthOf(x)!==m);tmp.floor.push(...mine);}
  else if(mv.card!=null){tmp.hands[p]=tmp.hands[p].filter(x=>x!==mv.card);tmp.floor.push(mv.card);}
  if(mv.card!=null){T.render(tmp,o.ro);SND.slap();await sleep(430/fast);}
  if(tmp.deck.length){const f=tmp.deck.shift();tmp.floor.push(f);T.render(tmp,o.ro);SND.slap(0.8);await sleep(560/fast);}
  const ev=GS.playTurn(s,mv,pick);
  T.render(s,o.ro);
  const bangs=ev.filter(e=>BANG[e.k]).map(e=>BANG[e.k]);
  if(bangs.length){T.shout(bangs.join(' '));SND.ding();}
  if(ev.some(e=>e.k==='take'&&e.cards.length))SND.slap(0.6);
  await sleep((bangs.length?750:350)/fast);

}

    const sc=GS.scoreOf(s.caps[p]).total;
    let go;
    if(p===0){draw();const a=await ask(PT,`${sc}점! 고? 스톱?`,`<b>고</b>: 계속해서 점수를 더 올려요 (고 1번마다 +1점, 3고부터는 2배씩). 대신 다른 사람이 먼저 점수를 내면 져요.<br><b>스톱</b>: 지금 끝내고 이겨요.`,['스톱','고!']);go=a===1;}
    else{go=GS.LEVELS[opt.level].go(s,p);}
    if(gen!==G.gen)return;
    if(go){PT.shout(`${s.go[p]+1}고!`);SND.ding();GS.declareGo(s);msg(`${p===0?'나':CNAME[p]}: <b>${s.go[p]}고!</b>`,'info');await sleep(700);}
    else{PT.shout('스톱!');SND.ding();GS.finish(s,p);await sleep(600);G.busy=false;draw();showResult();return;}
  }else if(r==='stop'){G.busy=false;draw();showResult();return;}
  else if(r==='nagari'){G.busy=false;draw();showResult();return;}
  G.busy=false;G.sel=null;draw();
  if(s.over){showResult();return;}
  if(s.turn!==0)aiTurn();else msg(turnMsg());
}
async function aiTurn(){
  const gen=G.gen;G.busy=true;draw();msg(turnMsg());
  await sleep(650);if(gen!==G.gen)return;
  const s=G.s,p=s.turn,lv=GS.LEVELS[opt.level];
  const mv=lv.choose(s,p);if(mv.shake){PT.shout('흔들기!');await sleep(500);}
  const ev=await animateTurn(PT,s,mv,GS.greedyPick(s,p),{ro:ro()});
  if(gen!==G.gen)return;describe(ev,p);await endTurn();
}
function showResult(){
  const s=G.s;
  if(s.winner<0){G.nagariNext=s.nagariNext||2;G.nextFirst=s.turn;
    PT.overlay(`<h3>나가리</h3><div>아무도 점수를 못 내고 패가 다 떨어졌어요. 다음 판은 점수가 <b>×${G.nagariNext}</b>예요.</div><div class="gbtns"><button class="btn primary" id="gNext">다음 판</button></div>`);
    $('gNext').onclick=()=>newGame(true);return;}
  const f=s.final,w=s.winner;let delta=0;
  for(const x of f.pay){if(w===0)delta+=x.amt*POINT;else if(x.q===0)delta-=x.amt*POINT;}
  money+=delta;store.set('money',money);
  const lv=GS.LEVELS[opt.level].name,r=rec[lv]||{w:0,l:0};if(w===0)r.w++;else r.l++;rec[lv]=r;store.set('rec',rec);
  G.nextFirst=w;
  const rows=f.parts.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}점</td></tr>`).join('')+(f.go?`<tr><td>${f.go}고</td><td>+${f.go}점</td></tr>`:'')+
    f.notes.filter(n=>!/고 \+/.test(n)).map(n=>`<tr><td colspan="2" style="text-align:left;color:var(--muted)">${n}</td></tr>`).join('');
  const pays=f.pay.map(x=>`<tr><td>${x.q===0?'나':CNAME[x.q]}${x.notes.length?` <span style="color:var(--muted)">(${x.notes.join(', ')})</span>`:''}</td><td>${x.amt}점 · ${won(x.amt*POINT)}</td></tr>`).join('');
  PT.overlay(`<h3>${w===0?'🎉 내가 이겼어요!':`${CNAME[w]} 승리`}</h3>
    ${s.chongtong?`<div>${s.chongtong}월 4장을 처음부터 들고 있어서 <b>총통</b>이에요.</div>`:''}
    <table class="gres" style="width:100%">${rows}</table><div style="margin:6px 0 2px;font-weight:700">진 사람이 내는 돈</div><table class="gres" style="width:100%">${pays}</table>
    <div style="margin-top:8px">내 돈 ${delta>=0?'+':''}${won(delta)} → <b>${won(money)}</b></div>
    <div class="gbtns"><button class="btn primary" id="gNext">다음 판</button></div>`);
  $('gNext').onclick=()=>newGame(true);
  renderRec();renderPanel();
}
function renderRec(){const lv=GS.LEVELS[opt.level].name,r=rec[lv]||{w:0,l:0};$('grec').innerHTML=`<b>${lv}</b> 상대 ${r.w}승 ${r.l}패 · 내 돈 ${won(money)}`;}
function renderLevels(){$('glevels').innerHTML=GS.LEVELS.map((l,k)=>`<button class="lv" role="radio" aria-checked="${k===opt.level}" data-k="${k}">${l.name}<span>${['막 둠','눈앞만','계산함','깊이 계산'][k]}</span></button>`).join('');}
$('glevels').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b)return;opt.level=+b.dataset.k;store.set('level',opt.level);renderLevels();renderRec();if(G&&!G.s.over)draw();});
$('gPlayers').value=String(opt.players);$('gPlayers').onchange=e=>{opt.players=+e.target.value;store.set('players',opt.players);G=null;newGame();};
$('gNew').onclick=()=>{G&&(G.nagariNext=1);newGame();};
$('gLabels').checked=PT.labels;$('gLabels').onchange=e=>{PT.setLabels(e.target.checked);LT.setLabels(e.target.checked);draw();renderLesson();};
$('gSound').checked=SND.on;$('gSound').onchange=e=>{SND.on=e.target.checked;store.set('sound',SND.on);};
$('gReset').onclick=()=>{money=100000;store.set('money',money);rec={};store.set('rec',rec);renderRec();renderPanel();};
addEventListener('resize',()=>{if(G)draw();renderLesson(true);});

/* ---------- 배우기 ---------- */
const LT=makeTable($('ltable'));
// 수업용 판 만들기: 내 손패·바닥·더미 위쪽·먹은 패를 정해 둠
function stateFrom(o){
  const used=new Set([...(o.hand||[]),...(o.floor||[]),...(o.top||[]),...(o.caps||[]),...(o.caps1||[])]);
  const rest=[...Array(48).keys()].filter(id=>!used.has(id));
  const opp=rest.splice(0,o.oppN==null?4:o.oppN);
  return{n:2,need:7,hands:[o.hand||[],opp],floor:o.floor||[],deck:(o.top||[]).concat(rest.slice(0,o.deckN==null?8:o.deckN)),caps:[o.caps||[],o.caps1||[]],
    turn:0,go:[0,0],goScore:[0,0],mult:[1,1],shook:[[],[]],bombPass:[0,0],ppeok:{},nagari:1,over:false,winner:-1,log:[],last:null};
}
const L=[
  {title:'화투 48장',type:'info',gallery:true,state:()=>({...stateFrom({floor:[...Array(48).keys()],deckN:0,oppN:0})}),

    quiz:{opts:['5점','8점','3점'],ans:1,msg:'정답! 고도리 5점 + 홍단 3점 = 8점이에요.',wrong:'새 3마리(고도리)와 붉은 띠 3장(홍단)이 있어요.'}},

let lessonDone=new Set(store.get('lessons',[]));
const LS={i:0,s:null,done:false,fb:null,busy:false};
function loadLesson(i){LS.i=i;LT.reset();LS.s=L[i].state();LS.done=L[i].type==='info';LS.fb=null;LS.busy=false;if(LS.done){lessonDone.add(i);store.set('lessons',[...lessonDone]);}renderLesson();}
function renderLesson(resizeOnly){
  if(!LS.s)return;const l=L[LS.i];
  LT.render(LS.s,{nameOf:q=>q===0?'나':'상대',canPlay:l.type==='move'&&!LS.done&&!LS.busy,gallery:!!l.gallery});
  if(resizeOnly)return;
  $('lchips').innerHTML=L.map((x,k)=>`<button class="chip${k===LS.i?' on':''}${lessonDone.has(k)?' done':''}" data-k="${k}">${k+1}. ${x.title}</button>`).join('');
  $('lstep').textContent=`${LS.i+1}강`;$('ltitle').textContent=l.title;$('ltext').innerHTML=l.text;
  if(l.type==='quiz'){$('lquiz').innerHTML=`<div class="quiz">${l.quiz.opts.map((v,k)=>`<button class="btn" data-i="${k}">${v}</button>`).join('')}</div>`;
    $('lquiz').querySelectorAll('button').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===l.quiz.ans;LS.fb={kind:ok?'ok':'no',msg:ok?l.quiz.msg:l.quiz.wrong};if(ok){LS.done=true;lessonDone.add(LS.i);store.set('lessons',[...lessonDone]);}renderLesson();});}
  else $('lquiz').innerHTML='';
  $('lfb').innerHTML=LS.fb?`<div class="fb ${LS.fb.kind}">${LS.fb.msg}</div>`:'';
  $('lnext').textContent=LS.i===L.length-1?'실전 하러 가기':'다음 강의';$('lnext').disabled=!LS.done;$('lreset').hidden=l.type==='info';
}
LT.el.addEventListener('click',async e=>{
  const l=L[LS.i];if(l.type!=='move'||LS.done||LS.busy)return;const c=e.target.closest('.gcard');if(!c)return;const id=+c.dataset.id;
  if(!LS.s.hands[0].includes(id))return;
  LS.busy=true;renderLesson(true);
  const ev=await animateTurn(LT,LS.s,{card:id},GS.greedyPick(LS.s,0),{ro:{nameOf:q=>q===0?'나':'상대'}});
  const r=l.check(ev,LS.s)||{};LS.fb={kind:r.ok?'ok':'no',msg:r.msg};LS.busy=false;
  if(r.ok){LS.done=true;lessonDone.add(LS.i);store.set('lessons',[...lessonDone]);}
  renderLesson();
});
$('lchips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)loadLesson(+b.dataset.k);});
$('lreset').onclick=()=>loadLesson(LS.i);
$('lnext').onclick=()=>{if(LS.i<L.length-1)loadLesson(LS.i+1);else showTab('play');};

/* ---------- 탭 ---------- */
function showTab(t){$('learn').hidden=t!=='learn';$('play').hidden=t!=='play';
  $('tabLearn').setAttribute('aria-selected',t==='learn');$('tabPlay').setAttribute('aria-selected',t==='play');
  if(t==='play'){if(!G)newGame();else draw();}else renderLesson();}
$('tabLearn').onclick=()=>showTab('learn');$('tabPlay').onclick=()=>showTab('play');
renderLevels();renderRec();loadLesson(0);
if(location.hash==='#play')showTab('play');
