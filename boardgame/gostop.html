<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보드게임">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>첫 고스톱 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽 판, 오른쪽 수업 노트/대국 패널 — 좁은 화면에선 위아래로 쌓임 */
:root{
  --bg:#eceeea; --surface:#f9faf8; --ink:#1d2320; --muted:#5b6661; --rule:#d3d9d4;
  --accent:#2d6a4f; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --danger:#b3362c; --danger-soft:#f6e1de; --ok:#2b7a47; --ok-soft:#dff0e4;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1b211e; --ink:#e4eae6; --muted:#98a59e; --rule:#2c3631;
  --accent:#74c49b; --accent-ink:#0e1411; --accent-soft:#22342a;
  --danger:#ff8074; --danger-soft:#3a201d; --ok:#83d6a1; --ok-soft:#1d3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1b211e; --ink:#e4eae6; --muted:#98a59e; --rule:#2c3631;
  --accent:#74c49b; --accent-ink:#0e1411; --accent-soft:#22342a;
  --danger:#ff8074; --danger-soft:#3a201d; --ok:#83d6a1; --ok-soft:#1d3326; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.boardbox{background:var(--frame);padding:6px;border-radius:10px;box-shadow:0 10px 30px -18px rgba(0,0,0,.55);max-width:560px;width:100%;margin:0 auto}
svg.board{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation;user-select:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.done::after{content:" ✓"}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h2{font-family:var(--f-display);font-size:24px;margin:2px 0 10px;text-wrap:balance}
.text{max-width:62ch}
.text b{color:var(--accent)}
.turn{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;margin:12px 0 4px}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:14.5px}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--danger-soft);border-left:4px solid var(--danger)}
.fb.info{background:var(--accent-soft);border-left:4px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:500 14px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quiz{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.stat.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat .n{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;font-size:14px}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
select{font:14px var(--f-body);padding:4px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.tips{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px;font-size:13.5px;color:var(--muted)}
.tips ul{margin:6px 0 0;padding-left:18px}
.result{font-variant-numeric:tabular-nums}
.rankcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.rank{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.rank small{font-size:15px;color:var(--muted);font-weight:400;margin-left:6px;font-family:var(--f-body)}
.sub{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font:13px var(--f-body);text-decoration:underline;cursor:pointer;padding:2px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.lv{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;font:500 15px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:1px}
.lv span{font-size:11.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.lv[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.lv:disabled{opacity:.4;cursor:not-allowed}
.wbar{height:10px;border-radius:5px;background:var(--bar-b);box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden;margin-top:4px}
.wbar span{display:block;height:100%;background:var(--bar-a);transition:width .4s}
.wrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
.tag.g{background:var(--ok-soft);color:var(--ok)} .tag.m{background:var(--accent-soft);color:var(--accent)}
.tag.s{background:var(--danger-soft);color:var(--danger)} .tag.b{background:var(--danger);color:var(--surface)}
.hist{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px dashed var(--rule)}
.thinking::after{content:"";display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none}}
.rv{border:0;cursor:pointer;font-family:inherit;line-height:1.6}
.rv:hover{text-decoration:underline}
.rvlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(8,12,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:460px;max-height:100%;overflow:auto;padding:18px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.rvhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rvhead h2{font-size:20px;margin:2px 0 10px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet .boardbox{max-width:min(420px,52vh)}
.sheet svg.board{cursor:default}
.legend{font-size:13px;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.lg{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c)}
.lg.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.boardcol{min-width:0;max-width:560px;width:100%;margin:0 auto}
.b3d{width:100%;aspect-ratio:var(--b3d-ratio,1);border-radius:6px;background:radial-gradient(ellipse at 50% 35%,var(--surface),var(--bg));overflow:hidden}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.btn.sm{padding:5px 11px;font-size:13px}
.pk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pk button{font:500 16px var(--f-body);padding:10px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.pk button:hover{border-color:var(--accent)}
#rvEyebrow{text-transform:none;letter-spacing:0}

/* 고스톱 전용 */
:root{--frame:#3b2414;--accent:#b3261e;--accent-soft:#f6dedb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f28b82;--accent-soft:#3a201d;--accent-ink:#1a0d0b}}
:root[data-theme="dark"]{--accent:#f28b82;--accent-soft:#3a201d;--accent-ink:#1a0d0b}
.gtable{position:relative;width:100%;border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 45%,#2f7d4f 0%,#1f5c3a 55%,#143d27 100%);box-shadow:inset 0 0 0 6px #5a3417,inset 0 0 0 9px #3b2210,0 14px 34px -18px rgba(0,0,0,.7)}
.gtable::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:5px 5px;pointer-events:none}
.gcard{position:absolute;left:0;top:0;transition:transform .42s cubic-bezier(.2,.75,.25,1),width .3s,height .3s,filter .2s;will-change:transform;perspective:600px}
.gcard .gin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s ease}
.gcard.down .gin{transform:rotateY(180deg)}
.gcard .gf,.gcard .gb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%;box-shadow:0 2px 4px rgba(0,0,0,.45)}
.gcard .gb{transform:rotateY(180deg)}
.gcard svg{display:block;width:100%;height:100%}
.gcard.can{cursor:pointer}
.gcard.can:hover{filter:brightness(1.08)}
.gcard.can:hover .gf{box-shadow:0 0 0 2px #ffd34d,0 6px 12px rgba(0,0,0,.5)}
.gcard.hl .gf{box-shadow:0 0 0 3px #ffd34d,0 0 14px 3px rgba(255,211,77,.8)}
.gcard.sel .gf{box-shadow:0 0 0 3px #4fc3f7,0 0 14px 3px rgba(79,195,247,.8)}
.gcard.dim{filter:brightness(.55)}
.glabel{position:absolute;font:700 11px var(--f-body);color:#e9f5ec;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
.glabel b{color:#ffd34d}
.glabel.turn{color:#ffd34d}
.gdeckn{position:absolute;font:800 12px var(--f-body);color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:1px 7px;pointer-events:none}
.gbang{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;font:900 44px var(--f-display);color:#ffd34d;
  text-shadow:0 3px 0 #7a1010,0 0 18px rgba(255,120,60,.8);pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1);z-index:500;white-space:nowrap}
.gbang.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.gover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,15,10,.55);z-index:600;padding:12px}
.gbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:16px 18px;max-width:380px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);max-height:100%;overflow:auto}
.gbox h3{margin:0 0 6px;font:700 20px var(--f-display)}
.gbox .gbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gbox .gbtns .btn{flex:1;font-size:16px;padding:10px}
.gpick{display:flex;gap:10px;justify-content:center;margin-top:8px}
.gpick button{border:0;background:none;padding:0;cursor:pointer;width:76px;border-radius:8px}
.gpick button:hover{outline:3px solid #ffd34d}
.gpick svg{display:block;width:100%;height:auto}
.gscore{display:grid;gap:8px;margin-bottom:12px}
.gsc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px}
.gsc.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gsc .gn{font-weight:700;font-size:14px}.gsc .gp{float:right;font:700 16px var(--f-display);color:var(--accent)}
.gsc .gd{color:var(--muted);font-size:12px;margin-top:2px}
.gmoney{font:700 13px var(--f-body);color:var(--muted)}
.gres td{padding:2px 6px;font-size:13.5px}.gres td:last-child{text-align:right;font-weight:700}
.gflip{margin-top:6px}

</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>첫 고스톱 교실<small>화투 그림 알아보기부터 쪽·뻑·고/스톱까지 직접 쳐 보면서 배워요. 맞고(2명)와 3명 고스톱. 가짜 돈으로만 해요.</small></h1>
    <div class="tabs" role="tablist"><button id="tabLearn" role="tab" aria-selected="true">배우기</button><button id="tabPlay" role="tab" aria-selected="false">실전</button></div>
  </header>
  <section id="learn" class="grid">
    <div class="boardcol"><div class="gtable" id="ltable" aria-label="연습용 판"></div></div>
    <div class="panel">
      <div class="chips" id="lchips"></div>
      <div class="eyebrow" id="lstep"></div>
      <h2 id="ltitle"></h2>
      <div class="text" id="ltext"></div>
      <div id="lquiz"></div><div id="lfb"></div>
      <div class="row"><button class="btn" id="lreset">다시 하기</button><button class="btn primary" id="lnext">다음</button></div>
    </div>
  </section>
  <section id="play" class="grid" hidden>
    <div class="boardcol"><div class="gtable" id="gtable" aria-label="고스톱 판"></div>
      <div class="viewbar"><button class="btn sm" id="flipOnly" hidden>뒤집기만 하기</button><span class="gmoney" id="gmoney"></span></div></div>
    <div class="panel">
      <div class="gscore" id="gscore"></div>
      <div id="gmsg" class="fb info"></div>
      <div class="row"><button class="btn primary" id="gNew">새 판</button></div>
      <div class="eyebrow" style="margin:16px 0 6px">컴퓨터 등급</div>
      <div class="levels" id="glevels" role="radiogroup" aria-label="컴퓨터 등급"></div>
      <div class="sub" id="grec"></div>
      <div class="opts">
        <label>인원 <select id="gPlayers"><option value="2">2명 (맞고)</option><option value="3">3명 고스톱</option></select></label>
        <label><input type="checkbox" id="gLabels"> 카드에 달·종류 표시</label>
        <label><input type="checkbox" id="gSound"> 소리</label>
      </div>
      <div class="tips"><strong>치는 법</strong><ul>
        <li>손패를 누르면 내요. 손패에 마우스를 올리면 바닥의 같은 달 패가 반짝여요.</li>
        <li>같은 달이 바닥에 2장이면 어느 것을 먹을지 물어봐요.</li>
        <li>맞고는 7점, 3명은 3점이 넘으면 고/스톱을 고를 수 있어요.</li>
        <li>점수와 돈은 모두 가짜예요. 1점 = 100원. <button class="linkbtn" id="gReset">돈·기록 처음으로</button></li>
      </ul></div>
    </div>
  </section>
</div>
<script>
/* ===== 고스톱 규칙 (맞고 2명 / 3명) =====
   2명: 10장씩, 바닥 8장, 7점부터 고/스톱.  3명: 7장씩, 바닥 6장, 3점부터 고/스톱.
   화투 48장: 달(1~12) × 4장. 카드 번호 id = (달-1)*4 + 순서.
   한 사람 10장, 바닥 8장, 더미 20장. 손에서 한 장 내고 더미에서 한 장 뒤집어 같은 달끼리 먹는다.
   7점이 나면 고(계속) 또는 스톱(끝내기). */
const GS=(()=>{
const G='gwang',Y='yeol',T='tti',P='pi';
// 달별 4장: [종류, 띠 종류 또는 특징]
const TABLE={
  1:[[G],[T,'hong'],[P],[P]],
  2:[[Y,'bird'],[T,'hong'],[P],[P]],
  3:[[G],[T,'hong'],[P],[P]],
  4:[[Y,'bird'],[T,'cho'],[P],[P]],
  5:[[Y],[T,'cho'],[P],[P]],
  6:[[Y],[T,'cheong'],[P],[P]],
  7:[[Y],[T,'cho'],[P],[P]],
  8:[[G],[Y,'bird'],[P],[P]],
  9:[[Y,'gukjin'],[T,'cheong'],[P],[P]],
  10:[[Y],[T,'cheong'],[P],[P]],
  11:[[G],[P,'ssang'],[P],[P]],
  12:[[G,'bi'],[Y],[T,'bi'],[P,'ssang']]};
const MONTH=['','송학','매조','벚꽃','흑싸리','난초','모란','홍싸리','공산','국진','단풍','오동','비'];
const CARDS=[];
for(let m=1;m<=12;m++)TABLE[m].forEach(([t,x],i)=>CARDS.push({id:(m-1)*4+i,m,t,x:x||null,pi:t===P?(x==='ssang'?2:1):0}));
const monthOf=id=>(id>>2)+1;
const TNAME={gwang:'광',yeol:'열끗',tti:'띠',pi:'피'};
function cardName(id){const c=CARDS[id];
  if(c.t===G)return `${c.m}월 ${c.x==='bi'?'비광':'광'}`;
  if(c.t===Y)return `${c.m}월 열끗${c.x==='bird'?'(새)':c.x==='gukjin'?'(국진)':''}`;
  if(c.t===T)return `${c.m}월 ${c.x==='hong'?'홍단':c.x==='cheong'?'청단':c.x==='cho'?'초단':''}띠`;
  return `${c.m}월 ${c.pi===2?'쌍피':'피'}`;}

/* ---------- 점수 ---------- */
// 9월 국진은 열끗 또는 쌍피 중 유리한 쪽으로 센다
function scoreOf(caps,opts={}){
  const best=[false,true].map(gukAsPi=>scoreRaw(caps,gukAsPi)).sort((a,b)=>b.total-a.total)[0];
  return best;
}
function scoreRaw(caps,gukAsPi){
  const cs=caps.map(id=>CARDS[id]);
  const gw=cs.filter(c=>c.t===G),hasBi=gw.some(c=>c.x==='bi');
  let yeol=cs.filter(c=>c.t===Y),tti=cs.filter(c=>c.t===T);

/* ---------- 판 시작 ---------- */

    const d=shuffle([...Array(48).keys()],o.rnd),A=k=>Array.from({length:n},()=>k());

    for(let p=0;p<s.n;p++){const hm={};s.hands[p].forEach(id=>hm[monthOf(id)]=(hm[monthOf(id)]||0)+1);

const clone=s=>JSON.parse(JSON.stringify(s));
const sameMonth=(list,m)=>list.filter(id=>monthOf(id)===m);

/* ---------- 내기 전에 고를 수 있는 것 ---------- */
// 손패의 달별 장수
function handMonths(s,p){const hm={};s.hands[p].forEach(id=>hm[monthOf(id)]=(hm[monthOf(id)]||0)+1);return hm;}

/* ---------- 한 차례 진행 ----------

function potential(caps){

function ribbon(kind){
  const col=kind==='cheong'?'#2c5fb3':'#d1262f',txt=kind==='hong'?'홍단':kind==='cheong'?'청단':'';
  return sum(path('M20 30 L40 30 L41 76 L30 70 L19 76 Z',col,'#5a1010',0.8),

const KIND_TAG={gwang:['광','#d8262f'],yeol:['열','#2f7ab5'],tti:['띠','#7b3fa0'],pi:['피','#6b6b6b']};
function face(id,o={}){
  const c=GS.CARDS[id],m=c.m;
  let art='';
  if(c.t==='pi'&&c.x==='ssang'&&m===12)art=PLANT[12]()+SPECIAL['12p'];
  else if(c.t==='pi'&&c.x==='ssang'&&m===11)art=PLANT[11]('y');
  else art=PLANT[m]();
  if(c.t==='gwang')art+=SPECIAL[m+'g']||'';
  if(c.t==='yeol')art+=SPECIAL[m+'y']||'';
  if(c.t==='tti')art+=ribbon(c.x);
  const bg=m===8&&c.t!=='gwang'?'#d83a2a':'#f6efe2';
  let marks='';
  if(c.t==='gwang')marks+=circ(50,82,7,'#fff','#d8262f',1.6)+'<text x="50" y="85.5" font-size="9" text-anchor="middle" fill="#d8262f" font-weight="900" font-family="serif">光</text>';
  if(o.labels!==false){
    marks+=`<rect x="2" y="2" width="12" height="11" rx="2.5" fill="rgba(255,255,255,.85)"/><text x="8" y="10.6" font-size="8.5" text-anchor="middle" fill="#222" font-weight="800" font-family="sans-serif">${m}</text>`;
    const [t,col]=KIND_TAG[c.t];const lab=c.pi===2?'쌍피':c.x==='gukjin'?'열/피':t;
    marks+=`<rect x="${W-2-(lab.length>1?20:12)}" y="2" width="${lab.length>1?20:12}" height="11" rx="2.5" fill="${col}"/><text x="${W-2-(lab.length>1?10:6)}" y="10.6" font-size="7.5" text-anchor="middle" fill="#fff" font-weight="800" font-family="sans-serif">${lab}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="hc${id}"><rect x="3" y="3" width="54" height="86" rx="4"/></clipPath></defs>
    <rect x="0.5" y="0.5" width="59" height="91" rx="6" fill="#1b1b1b"/><rect x="3" y="3" width="54" height="86" rx="4" fill="${bg}"/>
    <g clip-path="url(#hc${id})">${art}</g>${marks}</svg>`;
}
function back(){return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="59" height="91" rx="6" fill="#7a0f16"/><rect x="4" y="4" width="52" height="84" rx="4" fill="#c4161f"/><rect x="8" y="8" width="44" height="76" rx="3" fill="none" stroke="#e8505a" stroke-width="1"/><circle cx="30" cy="46" r="9" fill="none" stroke="#e8505a" stroke-width="1.2"/></svg>`;}
const cache={};
return{face:(id,o)=>{const k=id+(o&&o.labels===false?'n':'');return cache[k]||(cache[k]=face(id,o));},back:()=>cache.b||(cache.b=back()),W,H};
})();

const SND={ctx:null,on:store.get('sound',true),
  slap(v=1){if(!this.on)return;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    const c=this.ctx,now=c.currentTime,len=c.sampleRate*0.08,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1800+Math.random()*600;
    const g=c.createGain();g.gain.value=0.5*v;s.connect(f);f.connect(g);g.connect(c.destination);s.start(now);},
  ding(){if(!this.on||!this.ctx)return;const c=this.ctx,now=c.currentTime;for(const [f,v] of [[660,0.15],[990,0.08]]){const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.6);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+0.65);}}};

function makeTable(el){
  const cards={},labels={};let slotOf={},W=0,H=0,portrait=true,showLabels=store.get('labels',true);
  for(let id=0;id<48;id++){const d=document.createElement('div');d.className='gcard down';d.dataset.id=id;
    d.innerHTML=`<div class="gin"><div class="gf">${HW.face(id,{labels:showLabels})}</div><div class="gb">${HW.back()}</div></div>`;el.appendChild(d);cards[id]=d;}
  const deckN=document.createElement('div');deckN.className='gdeckn';el.appendChild(deckN);
  const bang=document.createElement('div');bang.className='gbang';el.appendChild(bang);
  function label(key){if(!labels[key]){const d=document.createElement('div');d.className='glabel';el.appendChild(d);labels[key]=d;}return labels[key];}
  function size(){W=el.clientWidth||360;portrait=W<620;H=Math.round(portrait?W*1.55:W*0.68);el.style.height=H+'px';}
  const put=(id,x,y,w,z,up,rot=0)=>{const d=cards[id];d.style.width=w+'px';d.style.height=(w*HW.H/HW.W)+'px';d.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`;d.style.zIndex=z;d.classList.toggle('down',!up);d.style.display='';};
  // 먹은 패: 광·열끗·띠·피 묶음
  function capsAt(list,x0,x1,y,cw){
    const groups={gwang:[],yeol:[],tti:[],pi:[]};list.forEach(id=>groups[CARDS[id].t].push(id));
    const gw=(x1-x0)/4;let gi=0;
    for(const k of ['gwang','yeol','tti','pi']){const g=groups[k].slice().sort((a,b)=>CARDS[a].pi-CARDS[b].pi||a-b),n=g.length;
      const step=n>1?Math.min(cw*0.42,(gw-cw-4)/(n-1)):0;
      g.forEach((id,i)=>put(id,x0+gi*gw+2+i*step,y,cw,40+i,true));gi++;}
  }
  function render(s,o={}){
    size();const me=o.viewer||0,n=s.n,others=[...Array(n).keys()].filter(q=>q!==me);
    const fw=portrait?W/8.4:H/6.4,hw=portrait?W/5.9:H/4.9,ow=portrait?W/13:H/10,cw=portrait?W/12.5:H/9,ch=x=>x*HW.H/HW.W;
    Object.values(cards).forEach(d=>{d.style.display='none';d.classList.remove('can','hl','sel','dim');});
    Object.values(labels).forEach(l=>l.style.display=o.gallery?'none':'');deckN.style.display=o.gallery?'none':'';
    if(o.gallery){   // 48장 한눈에: 달마다 4장을 나란히
      const cols=portrait?2:3,rows=12/cols,gw=(W-16)/cols,gh=(H-16)/rows,w=Math.min(gw/4.4,(gh-18)*HW.W/HW.H);
      for(let m=1;m<=12;m++){const c=(m-1)%cols,r=Math.floor((m-1)/cols);
        for(let i=0;i<4;i++)put((m-1)*4+i,8+c*gw+(gw-4*w*1.06)/2+i*w*1.06,8+r*gh+(gh-ch(w))/2,w,10+i,true);}
      return;}
    // 위: 상대들
    const topY=8;let capBottom=0;
    others.forEach((q,i)=>{const x0=8+i*(W-16)/others.length,x1=8+(i+1)*(W-16)/others.length;
      const lb=label('p'+q);lb.style.transform=`translate(${x0+4}px,${topY}px)`;lb.innerHTML=o.nameOf?o.nameOf(q):'';lb.classList.toggle('turn',s.turn===q&&!s.over);
      const h=s.hands[q],step=h.length>1?Math.min(ow*0.6,(x1-x0-ow-8)/(h.length-1)):0;
      h.forEach((id,k)=>put(id,x0+4+k*step,topY+16,ow,200+k,!!o.reveal));
      const cy=topY+20+ch(ow);capsAt(s.caps[q],x0,x1,cy,cw);capBottom=Math.max(capBottom,cy+ch(cw));});
    // 가운데: 더미와 바닥
    const fy0=capBottom+14,myCapY=portrait?H-ch(hw)*2-ch(cw)-30:H-ch(hw)-ch(cw)-26,fy1=myCapY-10;
    const deckX=10,deckY=(fy0+fy1)/2-ch(fw)/2;
    s.deck.forEach((id,k)=>put(id,deckX+Math.min(k,6)*0.6,deckY-Math.min(k,6)*0.6,fw,10+(s.deck.length-k),false));
    deckN.style.transform=`translate(${deckX+fw*0.15}px,${deckY+ch(fw)+4}px)`;deckN.textContent=s.deck.length?`${s.deck.length}장`:'';
    // 바닥 자리: 같은 달은 같은 자리에 겹쳐 놓음 (자리는 판 동안 유지)
    const used=new Set(s.floor.map(monthOf));for(const m in slotOf)if(!used.has(+m))delete slotOf[m];
    const taken=new Set(Object.values(slotOf)),cols=6,rows=2;
    for(const m of [...used].sort((a,b)=>a-b))if(slotOf[m]==null){for(let k=0;k<cols*rows;k++)if(!taken.has(k)){slotOf[m]=k;taken.add(k);break;}}
    const fx0=deckX+fw+16,cellW=(W-fx0-8)/cols,cellH=(fy1-fy0)/rows;
    const byM={};s.floor.forEach(id=>{(byM[monthOf(id)]=byM[monthOf(id)]||[]).push(id);});
    for(const m in byM){const k=slotOf[m],cx=fx0+(k%cols)*cellW+(cellW-fw)/2,cy=fy0+Math.floor(k/cols)*cellH+(cellH-ch(fw))/2;
      byM[m].forEach((id,i)=>put(id,cx+i*fw*0.2-(byM[m].length-1)*fw*0.1,cy+i*fw*0.14,fw,100+i,true,(id*37%7)-3));}
    // 아래: 내가 먹은 패와 내 손패
    const lb=label('p'+me);lb.style.transform=`translate(12px,${myCapY-16}px)`;lb.innerHTML=o.nameOf?o.nameOf(me):'';lb.classList.toggle('turn',s.turn===me&&!s.over);
    capsAt(s.caps[me],8,W-8,myCapY,cw);
    const hand=s.hands[me],per=portrait?5:10,hy=myCapY+ch(cw)+12;
    hand.forEach((id,k)=>{const row=Math.floor(k/per),col=k%per,cnt=Math.min(per,hand.length-row*per),gap=portrait?6:8;
      const tw=cnt*hw+(cnt-1)*gap,x=(W-tw)/2+col*(hw+gap),y=hy+row*(ch(hw)+8);
      put(id,x,y-(o.sel===id?10:0),hw,300+k,true);
      if(o.canPlay)cards[id].classList.add('can');if(o.sel===id)cards[id].classList.add('sel');});
    (o.hl||[]).forEach(id=>cards[id].classList.add('hl'));
    (o.dim||[]).forEach(id=>cards[id].classList.add('dim'));
  }
  function setLabels(on){showLabels=on;store.set('labels',on);for(let id=0;id<48;id++)cards[id].querySelector('.gf').innerHTML=HW.face(id,{labels:on});}
  let bt=null;function shout(t){bang.textContent=t;bang.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>bang.classList.remove('show'),900);}
  function overlay(html){let o=el.querySelector('.gover');if(!o){o=document.createElement('div');o.className='gover';el.appendChild(o);}o.innerHTML=`<div class="gbox">${html}</div>`;o.hidden=false;return o;}
  function closeOverlay(){const o=el.querySelector('.gover');if(o)o.hidden=true;}
  function reset(){slotOf={};}
  function deal(s,o){
    size();const fw=portrait?W/8.4:H/6.4,x=10,y=H*0.42;
    for(let id=0;id<48;id++){const d=cards[id];d.style.transition='none';d.style.transitionDelay='';put(id,x,y,fw,10,false);}
    void el.offsetWidth;
    const order=[];const n=s.n,hn=s.hands[0].length;
    for(let k=0;k<hn;k++)for(let p=0;p<n;p++)if(s.hands[p][k]!=null)order.push(s.hands[p][k]);   // 한 장씩 돌아가며
    s.floor.forEach(id=>order.push(id));
    for(let id=0;id<48;id++){const d=cards[id];d.style.transition='';const k=order.indexOf(id);d.style.transitionDelay=k>=0?(k*28)+'ms':'0ms';}
    render(s,o);
    setTimeout(()=>{for(let id=0;id<48;id++)cards[id].style.transitionDelay='';},order.length*28+600);
    return order.length*28+500;
  }
  return{el,render,deal,cards,setLabels,shout,overlay,closeOverlay,reset,get labels(){return showLabels;}};
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const BANG={jjok:'쪽!',ppeok:'뻑!',ttadak:'따닥!',sseul:'쓸!',bomb:'폭탄!',shake:'흔들기!',ppeokEat:'뻑 먹기!',four:'싹 먹기!'};

/* ---------- 한 차례 연출: 내기 → 뒤집기 → 먹기 ---------- */
async function animateTurn(T,s,mv,pick,o){
  const before=GS.clone(s),p=s.turn,fast=o.fast||1,tmp=GS.clone(before);
  if(mv.bomb){const m=monthOf(mv.card);const mine=tmp.hands[p].filter(x=>monthOf(x)===m);tmp.hands[p]=tmp.hands[p].filter(x=>monthOf(x)!==m);tmp.floor.push(...mine);}
  else if(mv.card!=null){tmp.hands[p]=tmp.hands[p].filter(x=>x!==mv.card);tmp.floor.push(mv.card);}
  if(mv.card!=null){T.render(tmp,o.ro);SND.slap();await sleep(430/fast);}
  if(tmp.deck.length){const f=tmp.deck.shift();tmp.floor.push(f);T.render(tmp,o.ro);SND.slap(0.8);await sleep(560/fast);}
  const ev=GS.playTurn(s,mv,pick);
  T.render(s,o.ro);
  const bangs=ev.filter(e=>BANG[e.k]).map(e=>BANG[e.k]);
  if(bangs.length){T.shout(bangs.join(' '));SND.ding();}
  if(ev.some(e=>e.k==='take'&&e.cards.length))SND.slap(0.6);
  await sleep((bangs.length?750:350)/fast);
  return ev;
}

async function humanMove(mv){
  const s=G.s,gen=G.gen;G.busy=true;G.hl=[];draw();
  const ans={};
  if(mv.card!=null&&!mv.bomb){const fm=GS.sameMonth(s.floor,monthOf(mv.card));if(fm.length===2)ans.play=await askCard(PT,'어느 패를 먹을까요?',`바닥에 ${monthOf(mv.card)}월 패가 2장 있어요. 하나를 골라 주세요.`,fm);}
  // 뒤집은 패도 고를 게 있는지 미리 확인 (더미 순서는 정해져 있음)
  let need=null;const t=GS.clone(s);GS.playTurn(t,mv,(list,k)=>k==='play'?ans.play:(need=list,list[0]));
  if(need){const f=s.deck[0];ans.flip=await askCard(PT,'뒤집은 패로 무엇을 먹을까요?',`더미에서 <b>${GS.cardName(f)}</b>가 나왔어요. 바닥의 같은 달 2장 중 하나를 골라 주세요.`,need);}
  if(gen!==G.gen)return;
  const ev=await animateTurn(PT,s,mv,(list,k)=>k==='play'?ans.play:(ans.flip!=null?ans.flip:list[0]),{ro:ro()});
  describe(ev,0);await endTurn();
}

}
async function endTurn(){
  const s=G.s,p=s.turn,gen=G.gen;
  const r=GS.afterTurn(s);
  if(r==='ask'){
    const sc=GS.scoreOf(s.caps[p]).total;
    let go;
    if(p===0){draw();const a=await ask(PT,`${sc}점! 고? 스톱?`,`<b>고</b>: 계속해서 점수를 더 올려요 (고 1번마다 +1점, 3고부터는 2배씩). 대신 다른 사람이 먼저 점수를 내면 져요.<br><b>스톱</b>: 지금 끝내고 이겨요.`,['스톱','고!']);go=a===1;}
    else{go=GS.LEVELS[opt.level].go(s,p);}
    if(gen!==G.gen)return;
    if(go){PT.shout(`${s.go[p]+1}고!`);SND.ding();GS.declareGo(s);msg(`${p===0?'나':CNAME[p]}: <b>${s.go[p]}고!</b>`,'info');await sleep(700);}

  }else if(r==='stop'){G.busy=false;draw();showResult();return;}
  else if(r==='nagari'){G.busy=false;draw();showResult();return;}
  G.busy=false;G.sel=null;draw();
  if(s.over){showResult();return;}
  if(s.turn!==0)aiTurn();else msg(turnMsg());
}

  {title:'고와 스톱',type:'quiz',state:()=>stateFrom({caps:[0,8,28,1,5,9],deckN:6,oppN:4}),
    text:'2명(맞고)은 <b>7점</b>, 3명은 <b>3점</b>이 넘으면 고 또는 스톱을 정해요.<br>· <b>스톱</b>: 지금 끝내고 이겨요.<br>· <b>고</b>: 계속해서 점수를 더 키워요. 고 한 번마다 +1점, 3고부터는 2배씩. 하지만 다른 사람이 먼저 점수를 내면 져요.<br>· <b>광박·피박</b>: 이긴 사람이 광이나 피로 점수를 냈는데 진 사람이 광이 하나도 없거나 피가 적으면 2배로 내요.<br><br><b>문제:</b> 내 점수가 6점(3광+홍단)일 때 할 수 있는 건?',
    quiz:{opts:['고 또는 스톱','아직 아무것도 못 함 (7점부터)'],ans:1,msg:'정답! 맞고는 7점부터 고/스톱을 정할 수 있어요.',wrong:'맞고는 7점이 되어야 해요.'}},
  {title:'이제 실전!',type:'info',state:()=>stateFrom({hand:[0,4,8,12,16],floor:[1,5,9,13],deckN:10}),
    text:'고스톱 요령:<br>1. 바닥에 <b>광·띠·열끗</b>이 있으면 먼저 먹기<br>2. 상대가 모으는 족보(고도리·단)는 끊어 주기<br>3. 피는 많을수록 좋아요 (피박도 피할 수 있어요)<br>4. 상대 점수가 높으면 무리한 <b>고</b>는 조심<br><br>실전에서 2명(맞고) 또는 3명을 고를 수 있어요. 신입부터 시작해 보세요.'}
];
let lessonDone=new Set(store.get('lessons',[]));
const LS={i:0,s:null,done:false,fb:null,busy:false};
function loadLesson(i){LS.i=i;LT.reset();LS.s=L[i].state();LS.done=L[i].type==='info';LS.fb=null;LS.busy=false;if(LS.done){lessonDone.add(i);store.set('lessons',[...lessonDone]);}renderLesson();}
function renderLesson(resizeOnly){
  if(!LS.s)return;const l=L[LS.i];
  LT.render(LS.s,{nameOf:q=>q===0?'나':'상대',canPlay:l.type==='move'&&!LS.done&&!LS.busy,gallery:!!l.gallery});
  if(resizeOnly)return;
  $('lchips').innerHTML=L.map((x,k)=>`<button class="chip${k===LS.i?' on':''}${lessonDone.has(k)?' done':''}" data-k="${k}">${k+1}. ${x.title}</button>`).join('');
  $('lstep').textContent=`${LS.i+1}강`;$('ltitle').textContent=l.title;$('ltext').innerHTML=l.text;
  if(l.type==='quiz'){$('lquiz').innerHTML=`<div class="quiz">${l.quiz.opts.map((v,k)=>`<button class="btn" data-i="${k}">${v}</button>`).join('')}</div>`;
    $('lquiz').querySelectorAll('button').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===l.quiz.ans;LS.fb={kind:ok?'ok':'no',msg:ok?l.quiz.msg:l.quiz.wrong};if(ok){LS.done=true;lessonDone.add(LS.i);store.set('lessons',[...lessonDone]);}renderLesson();});}
  else $('lquiz').innerHTML='';
  $('lfb').innerHTML=LS.fb?`<div class="fb ${LS.fb.kind}">${LS.fb.msg}</div>`:'';
  $('lnext').textContent=LS.i===L.length-1?'실전 하러 가기':'다음 강의';$('lnext').disabled=!LS.done;$('lreset').hidden=l.type==='info';
}
LT.el.addEventListener('click',async e=>{
  const l=L[LS.i];if(l.type!=='move'||LS.done||LS.busy)return;const c=e.target.closest('.gcard');if(!c)return;const id=+c.dataset.id;
  if(!LS.s.hands[0].includes(id))return;
  LS.busy=true;renderLesson(true);
  const ev=await animateTurn(LT,LS.s,{card:id},GS.greedyPick(LS.s,0),{ro:{nameOf:q=>q===0?'나':'상대'}});
  const r=l.check(ev,LS.s)||{};LS.fb={kind:r.ok?'ok':'no',msg:r.msg};LS.busy=false;
  if(r.ok){LS.done=true;lessonDone.add(LS.i);store.set('lessons',[...lessonDone]);}
  renderLesson();
});
$('lchips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)loadLesson(+b.dataset.k);});
$('lreset').onclick=()=>loadLesson(LS.i);
$('lnext').onclick=()=>{if(LS.i<L.length-1)loadLesson(LS.i+1);else showTab('play');};

/* ---------- 탭 ---------- */
function showTab(t){$('learn').hidden=t!=='learn';$('play').hidden=t!=='play';
  $('tabLearn').setAttribute('aria-selected',t==='learn');$('tabPlay').setAttribute('aria-selected',t==='play');
  if(t==='play'){if(!G)newGame();else draw();}else renderLesson();}
$('tabLearn').onclick=()=>showTab('learn');$('tabPlay').onclick=()=>showTab('play');
renderLevels();renderRec();loadLesson(0);
if(location.hash==='#play')showTab('play');

</script>
