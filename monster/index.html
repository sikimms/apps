<title>별빛 몬스터 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 스티커 앨범처럼: 밤하늘 책상 위에 카드 수집 책 한 권, 큰 손가락 버튼 */
:root{color-scheme:dark;--sky:#090c14;--sky2:#141927;--paper:#171d2c;--ink:#eef2ff;--gold:#e8b84b;--pink:#ff6f91;--mint:#5fe0b7;--mute:#a9bbdc;
 --fire:#ff7043;--water:#3fa7ff;--leaf:#52c465;--bolt:#ffcf33;--d:"Black Han Sans","Gowun Dodum",sans-serif;--b:"Gowun Dodum",sans-serif}

body{background:var(--sky);color:#fff;font:600 16px/1.45 var(--b);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:560px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff9,transparent),radial-gradient(2px 2px at 78% 12%,#fff7,transparent),radial-gradient(3px 3px at 40% 34%,#ffe9a0aa,transparent),radial-gradient(2px 2px at 88% 52%,#fff6,transparent),radial-gradient(2px 2px at 22% 70%,#fff7,transparent),radial-gradient(3px 3px at 62% 84%,#ffe9a088,transparent)}
#app>*{position:relative}
h1{font:400 30px/1.15 var(--d);margin:0;color:var(--gold);text-wrap:balance}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.coin{display:inline-flex;align-items:center;gap:6px;background:#0007;border-radius:99px;padding:6px 12px;font:400 20px var(--d);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.coin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#d99a00);box-shadow:inset 0 0 0 2px #b97f00}
.big{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:16px;text-align:left;color:var(--ink);background:var(--paper);font:400 24px var(--d);cursor:pointer;box-shadow:0 0 0 1px #313b55,0 5px 0 #05070d}
.big small{display:block;font:600 14px var(--b);color:#9aa8c7;margin-top:2px}
.big.gift{background:linear-gradient(120deg,#5fe0b7,#8ff0d4 40%,#ffe9a0 52%,#8ff0d4 64%,#45c79e);background-size:260% 100%;animation:foilbg 3.5s linear infinite;box-shadow:0 0 0 2px #ffe9a0,0 5px 0 #2b8f6f,0 0 22px #5fe0b766}

.gfx{position:relative;width:96px;height:80px;flex:none}

.glid{transform-origin:50px 46px;animation:lid 1.6s ease-in-out infinite}
@keyframes lid{0%,60%,100%{transform:none}70%{transform:translateY(-6px) rotate(-6deg)}80%{transform:translateY(-3px) rotate(4deg)}}
.gcard{position:absolute;width:44px;border-radius:5px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px #0006;z-index:1;animation:peek 1.6s ease-in-out infinite}

.g1{left:18px;top:4px;transform:rotate(-14deg)}.g2{left:42px;top:0;transform:rotate(10deg);animation-delay:.15s}
@keyframes peek{0%,60%,100%{translate:0 10px}72%{translate:0 0}}

.s1{left:0;top:10px}.s2{right:2px;top:18px;animation-delay:.5s}.s3{left:44px;top:-4px;animation-delay:.9s;font-size:12px}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}

.menu{display:grid;gap:14px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:400 19px var(--d);background:var(--gold);color:#3c2a00;cursor:pointer;box-shadow:0 4px 0 #b98b10;min-height:48px}

.r-SR::after,.r-UR::after,.r-SEC::after,.r-R::after{content:"";position:absolute;inset:-40%;pointer-events:none;background:linear-gradient(115deg,transparent 42%,#ffffff55 49%,transparent 56%);animation:foil 3s linear infinite}
.r-UR::after{background:linear-gradient(115deg,transparent 36%,#ffe9a0a0 47%,#fff 50%,#ffe9a0a0 53%,transparent 64%)}
.r-SEC::after{background:linear-gradient(115deg,transparent 30%,#ff4d6d66 40%,#ffd24a66 46%,#5cff9d66 52%,#4fd6ff66 58%,#a65cff66 64%,transparent 72%);animation-duration:2s}
@keyframes foil{from{transform:translateX(-45%)}to{transform:translateX(45%)}}

.card.none svg{filter:brightness(0) opacity(.5)}.card.none .rb{display:none}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.srch{position:relative;margin-top:10px}.srch input{width:100%;box-sizing:border-box;border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:12px;padding:11px 44px 11px 14px;font:600 16px var(--b);user-select:text;-webkit-user-select:text}.srch input::placeholder{color:#fff9}.srch input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}.srch button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#ffffff22;color:#fff;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer}
.pager select{background:#ffffff1c;color:#fff;border:1px solid #ffffff33;border-radius:10px;padding:8px 10px;font:600 15px var(--b);font-variant-numeric:tabular-nums}.pager select option{color:#000}
.pager span{font:600 14px var(--b);font-variant-numeric:tabular-nums}.bar{height:8px;border-radius:9px;background:#0007;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.oddtb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;font:600 12px var(--b);color:#c8d2e8;margin-top:6px}.oddtb b{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.tabs button{flex:1 1 auto;white-space:nowrap;border:0;background:#ffffff1c;color:#fff;border-radius:10px;padding:8px 10px;font:400 16px var(--d);cursor:pointer;min-height:42px}
.bk textarea{width:100%;height:110px;box-sizing:border-box;border-radius:12px;border:1px solid #ffffff33;background:#0008;color:#fff;font:13px/1.4 ui-monospace,monospace;padding:10px;word-break:break-all;resize:none;user-select:text;-webkit-user-select:text}
.ov.bk{overflow-y:auto;align-items:start}.bk p{font:600 15px/1.5 var(--b);margin:6px 0 10px}.bk .row{justify-content:center;flex-wrap:wrap}.tabs button.on{background:var(--gold);color:#3c2a00}
.star{color:#e0a000;letter-spacing:-1px}
/* 팩 */
.pack{display:block;margin:18px auto;width:min(66vw,240px);border:0;background:none;cursor:pointer;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.03)}}

.big-card{max-width:220px;margin:10px auto}
.card.pick{outline:3px solid var(--mint);outline-offset:1px}

.side svg{width:100%;height:auto;border-radius:8px;display:block}.side.hit svg{animation:shk .35s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.st2{font:600 12.5px var(--b);color:#aab6d0;font-variant-numeric:tabular-nums}
.hp{height:12px;border-radius:9px;background:#0009;overflow:hidden;margin:4px 0 2px}.hp i{display:block;height:100%;background:var(--mint);transition:width .35s}.hp i.low{background:var(--pink)}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--mint)}.dots i.off{background:#fff2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.how{text-align:left;font:600 15px/1.6 var(--b)}.how h3{font:400 19px var(--d);color:var(--gold);margin:16px 0 4px}.how p{margin:4px 0}.how ul{margin:4px 0;padding-left:20px}
.ctb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;background:#ffffff0d;border-radius:10px;padding:10px;font-size:14px;word-break:keep-all}.ctb b{font-weight:700}
@media (max-width:440px){.ctb{grid-template-columns:1fr}}
#app>.ov{position:fixed;inset:0;z-index:20;background:#05070ee8;display:grid;place-items:center;padding:20px;text-align:center}.ov>div{max-width:360px}
.ov h2{font-size:34px;color:var(--gold)}
.pkwrap{display:flex;justify-content:center;margin:14px 0 6px}
.pk{position:relative;width:min(62vw,230px);aspect-ratio:5/8;cursor:pointer;animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 18px #000a);user-select:none}
.pk.empty{opacity:.4;cursor:default;animation:none}.pk.opened{animation:none}
.pkbody,.pkstrip{position:absolute;left:0;right:0;background:linear-gradient(115deg,#4a0d28,#c42d62 26%,#ff9ec0 42%,#fff3f8 48%,#ff9ec0 54%,#c42d62 70%,#3a0920);background-size:260% 100%;animation:foilbg 4.5s linear infinite}
@keyframes foilbg{to{background-position:-260% 0}}

.pkstrip::before,.pkbody::before{content:"";position:absolute;left:0;right:0;height:55%;background:repeating-linear-gradient(90deg,#0003 0 2px,transparent 2px 5px)}
.pkstrip::before{top:0}.pkstrip::after{content:"";position:absolute;left:0;right:0;bottom:-1px;border-bottom:2px dashed #ffffffb0}

.pklogo{font:400 19px/1.1 var(--d);color:#fff;text-align:center;text-shadow:0 2px 0 #7a0f35,0 0 12px #fff8}
.pkwin{width:100%;border-radius:8px;overflow:hidden;border:3px solid #ffffffd0;box-shadow:0 0 14px #fff6}.pkwin{background:radial-gradient(circle at 50% 40%,#fff6,#0000 70%),#00000033}
.clg{position:relative;display:block;width:100%;aspect-ratio:6/5;flex:none}

.pkc{position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle at 50% 42%,#ffd24a 0 9%,#0000 10%),radial-gradient(circle at 50% 42%,#33479a,#141b44 55%,#080b1f);border:2px solid #e8b84b;box-shadow:0 2px 6px #000a}
.sqwrap{display:flex;justify-content:center;margin:6px 0}
.sq{position:relative;width:min(58vw,220px);border-radius:12px;overflow:hidden;touch-action:none;animation:cardout .5s cubic-bezier(.2,.8,.2,1)}
.sq .card{cursor:default}
.sqback{position:absolute;inset:0;z-index:5;border-radius:10px;background:radial-gradient(1.5px 1.5px at 18% 22%,#fff,#0000),radial-gradient(1px 1px at 72% 16%,#fff,#0000),radial-gradient(2px 2px at 84% 64%,#ffe9a0,#0000),radial-gradient(1px 1px at 30% 78%,#fff,#0000),radial-gradient(1.5px 1.5px at 58% 88%,#fff,#0000),radial-gradient(1px 1px at 10% 55%,#fff,#0000),radial-gradient(circle at 50% 42%,#33479a,#141b44 55%,#080b1f);border:3px solid #e8b84b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#e8b84b;font:400 38px var(--d);cursor:grab;transition:transform .25s;box-shadow:0 -8px 16px #000b;touch-action:none}

<div id="app"><h1>별빛 몬스터 카드</h1><p class="note">카드 앨범을 펼치는 중이에요…</p></div>

function evolve(){const m=byId(T.id),e=evoOf(m);if(!e||has(m.id)<3)return;me().cards[m.id]-=3;if(!me().cards[m.id])delete me().cards[m.id];me().cards[e.id]=has(e.id)+1;save();SFX.evo();
 A.insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div><h2>진화했어요!</h2><div class="big-card">${cardHtml(e)}</div><button class="btn" id="ovok">좋아요!</button></div></div>`);T.id=e.id;}

/* ---------- 게임 방법 ---------- */
const chip=k=>`<b style="color:${EL[k].lt}">${EL[k].n}</b>`;
function vHowto(){A.innerHTML=head('게임 방법')+`<div class="how">
 <h3>1. 카드팩 뜯기</h3><p>팩을 누르면 카드 5장이 나와요. 카드를 눌러 한 장씩 뒤집어요. 뒷면이 빛나면 슈퍼레어 이상이에요!</p>
 <p>하루 선물로 ${DAILY}팩을 받고, ${REGEN/60000}분마다 1팩이 저절로 생겨요(${MAXP}팩까지). 대결에서 이겨도 받아요.</p>
 <h3>2. 등급</h3><div class="oddtb" style="justify-content:flex-start">${ODDS_R.map(r=>`<span><b>${RAR[r].s}</b> ${RAR[r].n} ${RAR[r].o}%</span>`).join(' · ')}</div>
 <p>팩마다 1장은 고급 이상이에요. 특별 카드(SR·UR·SEC)는 같은 몬스터보다 조금 더 강해요.</p>
 <h3>3. 도감과 진화</h3><p>모은 카드는 도감에 쌓여요. 없는 카드는 그림자로 보여요. 전체 ${VIS.length}장을 모아 봐요!</p>
 <p>같은 카드 3장을 모으면 도감에서 카드를 눌러 <b>진화</b>할 수 있어요. 어린 → 보통 → 고대 순서예요.</p>
 <h3>⬆️ 강화</h3><p>도감에서 카드를 누르면 별가루로 한 단계 높은 등급으로 강화할 수 있어요 (C→U ${UPC.C} · U→R ${UPC.U} · R→SR ${UPC.R} · SR→UR ${UPC.SR} · UR→SEC ${UPC.UR}). 등급이 오르면 HP와 힘도 세져요.</p>
 <h3>✨ 별가루</h3><p>겹친 카드는 별가루로 바꿀 수 있어요 (${ODDS_R.map(r=>`${RAR[r].s} ${DUST[r]}`).join(' · ')}). 도감 위의 버튼을 누르면 한 번에 바꿔요.</p><p>별가루로 갖고 싶은 카드를 얻을 수 있어요. 도감에서 그림자 카드를 눌러 봐요! (${ODDS_R.map(r=>`${RAR[r].s} ${BUY[r]}`).join(' · ')})</p>
 <h3>4. 대결</h3><p>카드 3장으로 팀을 짜요. 번갈아 한 가지를 골라요.</p>
 <ul><li><b>공격:</b> 카드의 힘만큼 피해를 줘요.</li><li><b>필살기:</b> 힘의 2배! 쓰고 나면 3턴 동안 못 써요.</li><li><b>교체:</b> 다른 카드로 바꿔요. 차례를 한 번 써요.</li></ul>
 <p>상대 카드 3장의 HP를 모두 0으로 만들면 이겨요. 이기면 카드팩을 받아요 (컴퓨터 쉬움 ${LEVEL[0].win}팩 · 보통 ${LEVEL[1].win}팩 · 어려움 ${LEVEL[2].win}팩).</p>
 <h3>5. 상성</h3><p>강한 상대를 때리면 피해 <b>1.6배</b>, 약한 상대를 때리면 <b>0.7배</b>예요. 유리한 카드로 교체하면 이기기 쉬워요.</p>
 <div class="ctb">${ELK.map(k=>`<div>${chip(k)} → ${BEATS[k].map(chip).join(', ')}</div>`).join('')}</div>
 </div><div class="row" style="margin-top:14px"><button class="btn" data-go="home">알았어요!</button></div>`;}
function vHowtoInto(){const save_=A.innerHTML;vHowto();const html=A.querySelector('.how').outerHTML;A.innerHTML=save_;document.getElementById('hwb').innerHTML=html+'<div class="row" style="margin-top:12px"><button class="btn" id="hwClose">닫기</button></div>';}
/* ---------- 대결 준비: 3장 고르기 ---------- */
function ownedList(p){return MON.filter(m=>p.cards[m.id]).sort((a,b)=>b.atk+b.hp-a.atk-a.hp);}
function startPick(kind){const a=S.me,b=a==='kid'?'dad':'kid';
 if(!ownedList(S.p[a]).length)return go('pack');
 go('pick',{kind,turn:a,order:kind==='two'?[a,b]:[a],teams:{},sel:[],page:0});}
function vPick(){const P=S.p[T.turn],own=ownedList(P),N=30,pages=Math.max(1,Math.ceil(own.length/N));
 if(!own.length){A.innerHTML=head('팀 고르기')+`<div class="msg">${P.name}에게 카드가 없어요. 먼저 카드팩을 뜯어 주세요.</div><div class="row"><button class="btn" data-who2="${T.turn}">${P.name} 카드팩 뜯으러 가기</button></div>`;return;}
 const need=Math.min(3,own.reduce((a,m)=>a+P.cards[m.id],0));T.need=need;
 A.innerHTML=head('팀 고르기')+`<div class="msg"><b>${P.name}</b>, 카드 ${need}장을 골라요 (${T.sel.length}/${need})</div>
 <div class="row"><button class="btn alt" id="pickClr">다시 고르기</button><button class="btn" id="pickOk" ${T.sel.length===need?'':'disabled'}>결정!</button></div>
 <div class="grid">${own.slice(T.page*N,T.page*N+N).map(m=>cardHtml(m,{cnt:P.cards[m.id],pick:T.sel.includes(m.id),stat:1})).join('')}</div>
 ${pages>1?`<div class="pager"><button class="btn alt" data-ppg="${T.page-1}" ${T.page?'':'disabled'}>← 이전</button><span>${T.page+1} / ${pages}쪽</span><button class="btn alt" data-ppg="${T.page+1}" ${T.page<pages-1?'':'disabled'}>다음 →</button></div>`:''}`;}
function pickOk(){T.teams[T.turn]=T.sel.slice();const i=T.order.indexOf(T.turn);if(i<T.order.length-1){T.turn=T.order[i+1];T.sel=[];T.page=0;A.innerHTML=`<div class="ov"><div><h2>폰을 넘겨요</h2><p>${S.p[T.turn].name} 차례예요.</p><button class="btn" id="passOk">받았어요</button></div></div>`;return;}beginFight();}
function aiTeam(ids){const L=LEVEL[lv];return ids.map(i=>{const m=byId(i),t=Math.max(1,Math.min(3,m.tier+L.tier-(Math.random()<.3?1:0)));let l=VIS.filter(x=>x.tier===t&&x.rar==='C');if(Math.random()<L.smart){const c=l.filter(x=>BEATS[x.el].includes(m.el));if(c.length)l=c;}return l[Math.floor(Math.random()*l.length)].id;});}
function beginFight(){const K=T.kind,a=T.order[0],b=K==='two'?T.order[1]:'ai',mk=(ids,name,key)=>({key,name,team:ids.map(i=>({m:byId(i),hp:byId(i).hp,cool:0})),i:0});
 go('fight',{kind:K,A:mk(T.teams[a],S.p[a].name,a),B:mk(K==='two'?T.teams[b]:aiTeam(T.teams[a]),K==='two'?S.p[b].name:'컴퓨터 '+LEVEL[lv].n,b),turn:0,msg:'대결 시작!',busy:false});}
/* ---------- 대결 ---------- */
const cur=s=>s.team[s.i];const sideOf=()=>T.turn===0?[T.A,T.B]:[T.B,T.A];
function sideHtml(s,act,hit){const c=cur(s),pct=Math.max(0,c.hp/c.m.hp*100);return `<div class="side${act?' act':''}${hit?' hit':''}">${art(c.m)}<div style="min-width:0"><div style="font:700 15px var(--b);color:var(--mute)">${s.name}</div><div style="font:400 18px/1.2 var(--d);color:var(--gold)">${c.m.name}</div><div class="st2">${EL[c.m.el].n} · 힘 ${c.m.atk}</div><div class="hp" role="img" aria-label="체력 ${Math.max(0,c.hp)}"><i class="${pct<35?'low':''}" style="width:${pct}%"></i></div><div class="st2">HP ${Math.max(0,c.hp)} / ${c.m.hp}</div><div class="dots">${s.team.map(x=>`<i class="${x.hp>0?'':'off'}"></i>`).join('')}</div></div></div>`;}
function mult(a,b){return BEATS[a.el].includes(b.el)?1.6:BEATS[b.el].includes(a.el)?.7:1;}
function vFight(){const [me_,op]=sideOf(),c=cur(me_),d=cur(op),mine=T.kind==='two'||T.turn===0,mu=mult(c.m,d.m);
 A.innerHTML=`<div class="top"><button class="btn alt" id="quit">그만하기</button><button class="btn alt" data-go2="howto">방법</button></div>${sideHtml(T.B,T.turn===1,T.hitSide===1)}<div class="msg" aria-live="polite">${T.msg}</div>${sideHtml(T.A,T.turn===0,T.hitSide===0)}
 ${mine&&!T.busy?`<div class="msg" style="margin:10px 0 4px;color:var(--gold)">${me_.name} 차례!${mu>1?' 내가 유리해요 ×1.6':mu<1?' 내가 불리해요 ×0.7':''}</div><div class="acts"><button class="btn" data-atk="n">공격<br><small style="font:600 13px var(--b)">힘 ${c.m.atk}</small></button><button class="btn pink" data-atk="s" ${c.cool>0?'disabled':''}>필살기<br><small style="font:600 13px var(--b)">${c.cool>0?c.cool+'턴 뒤에':'힘 ×2'}</small></button></div>${me_.team.length>1?`<div class="tabs">${me_.team.map((x,i)=>i===me_.i?'':`<button data-swap="${i}" ${x.hp>0?'':'disabled style="opacity:.4"'}>교체: ${x.m.name}<br>${EL[x.m.el].n} · HP ${Math.max(0,x.hp)}</button>`).join('')}</div>`:''}`:''}`;T.hitSide=null;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function nextTurn(){T.turn=T.turn?0:1;T.busy=false;T.msg=' ';
 if(T.kind==='ai'&&T.turn===1){T.busy=true;vFight();setTimeout(()=>{if(view!=='fight')return;T.busy=false;aiMove();},650);return;}
 vFight();}
function aiMove(){const L=LEVEL[lv],e=cur(T.B),p=cur(T.A);
 if(Math.random()<L.smart&&mult(e.m,p.m)<1){const i=T.B.team.findIndex((x,k)=>k!==T.B.i&&x.hp>0&&mult(x.m,p.m)>1);if(i>=0)return swap(i);}
 attack(e.cool===0&&Math.random()<(L.smart?(p.hp<=e.m.atk*2?.9:.4):.2)?'s':'n');}
async function swap(i){if(T.busy)return;const [s]=sideOf();if(!s.team[i]||s.team[i].hp<=0||i===s.i)return;T.busy=true;s.team.forEach(x=>{if(x.cool>0)x.cool--;});s.i=i;SFX.tap();T.msg=`${s.name}: ${cur(s).m.name} 나와라!`;vFight();await wait(800);if(view!=='fight')return;nextTurn();}
async function attack(kind){if(T.busy)return;T.busy=true;const [s,o]=sideOf(),c=cur(s),d=cur(o),mu=mult(c.m,d.m),dmg=Math.max(1,Math.round(c.m.atk*(kind==='s'?2:1)*mu*(.85+Math.random()*.3)));
 s.team.forEach(x=>{if(x.cool>0)x.cool--;});if(kind==='s')c.cool=3;d.hp-=dmg;T.hitSide=T.turn===0?1:0;SFX.hit();
 T.msg=`${c.m.name}의 ${kind==='s'?'필살기':'공격'}! ${dmg} 피해${mu>1?' · 효과 최고!':mu<1?' · 효과가 약해요':''}`;vFight();await wait(900);if(view!=='fight')return;
 if(d.hp<=0){const nx=o.team.findIndex(x=>x.hp>0);if(nx<0)return endFight(s);o.i=nx;T.msg=`${d.m.name} 쓰러졌어요. ${cur(o).m.name} 나와라!`;vFight();await wait(900);if(view!=='fight')return;}
 nextTurn();}
function endFight(w){T.busy=true;const two=T.kind==='two';let line,won=w===T.A;
 if(two){const wk=w.key,lk=wk===T.A.key?T.B.key:T.A.key;S.p[wk].packs+=2;S.p[lk].packs+=1;line=`${w.name} 승리! 카드팩 +2<br>${S.p[lk].name}도 수고 카드팩 +1`;SFX.win();}
 else{const g=won?LEVEL[lv].win:0;me().packs+=g;line=won?`내가 이겼어요! 카드팩 +${g}`:'아쉬워요. 유리한 속성으로 교체해 봐요!';won?SFX.win():SFX.lose();}
 save();A.insertAdjacentHTML('beforeend',`<div class="ov"><div><h2>${two?'대결 끝!':won?'승리!':'패배'}</h2><p style="font:700 18px var(--b)">${line}</p><div class="row"><button class="btn" data-go="home">처음으로</button>${two?'':'<button class="btn alt" data-go="pack">팩 뜯으러</button>'}</div></div></div>`);}

 if(x=q('[data-go]')){SFX.tap();return go(x.dataset.go);}

 if(q('#hwClose')){const o=document.getElementById('hw');if(o)o.remove();return;}

 if(q('#bkOpen'))return bkShow();

 if(q('#bkCopy')){const ta=document.getElementById('bkOut'),m=document.getElementById('bkMsg'),ok=()=>{m.textContent='복사했어요! 안전한 곳에 붙여 넣어 두세요.';};ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value).then(ok,()=>{try{document.execCommand('copy');ok();}catch(_){m.textContent='길게 눌러서 직접 복사해 주세요.';}});}catch(_){try{document.execCommand('copy');ok();}catch(__){m.textContent='길게 눌러서 직접 복사해 주세요.';}}return;}
 if(x=q('#bkLoad')){const v=bkParse(document.getElementById('bkIn').value),m=document.getElementById('bkMsg');if(!v){m.textContent='코드가 맞지 않아요. BYB1:로 시작하는 코드를 전부 붙여 넣어 주세요.';delete x.dataset.sure;return;}
  if(!x.dataset.sure){x.dataset.sure='1';x.textContent='정말 바꿀까요? 한 번 더 누르기';m.textContent='지금 이 기기의 카드는 백업 코드 내용으로 바뀌어요.';return;}
  S=v;refill();save();SFX.evo();const o=document.getElementById('ov');if(o)o.remove();go('home');A.insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div><h2>불러왔어요!</h2><p style="font:700 18px var(--b)">모은 카드가 돌아왔어요.</p><button class="btn" id="ovClose">좋아요!</button></div></div>`);return;}
 if(q('[data-snd]')){sound=!sound;try{localStorage.setItem('byeolbit-snd',sound?'1':'0');}catch(_){}return go('home');}
 if(q('#flipAll')){const fa=document.getElementById('flipAll');fa.hidden=true;const step=()=>{if(view!=='pack'||!T.got||T.idx>=5)return;if(!T.sqDone)openSq();else showSq();setTimeout(step,T.sqDone?120:350);};step();return;}
 if(q('#again')){return go(me().packs>0?'pack':'home');}
 if(x=q('[data-flip]')){if(x.classList.contains('open'))return;x.classList.add('open');const tr=+x.dataset.tier,i=+x.dataset.flip,gm=T.got[i];tr>=3?SFX.super():tr===2?SFX.rare():SFX.flip();
  const pm=document.getElementById('pm');if(pm)pm.textContent=(tr>=2?RAR[gm.rar].n+'! ':'')+(T.fresh[i]?'새 카드 ':'')+gm.name;
  if(--T.left===0){document.getElementById('again').hidden=false;const fa=document.getElementById('flipAll');if(fa)fa.hidden=true;}return;}
 if(q('#aqx'))return go('album',{filter:T.filter,rar:T.rar});
 if(x=q('[data-own]')){albumOwn=x.dataset.own==='1';SFX.tap();return go('album',{filter:T.filter,rar:T.rar,q:T.q});}
 if(x=q('[data-filter]'))return go('album',{filter:x.dataset.filter,rar:T.rar,q:T.q});
 if(x=q('[data-rf]'))return go('album',{filter:T.filter,rar:x.dataset.rf,q:T.q});
 if(x=q('[data-pg]')){if(!x.disabled)go('album',{filter:T.filter,rar:T.rar,q:T.q,page:+x.dataset.pg});return;}
 if(q('#evo'))return evolve();
 if(q('#dustAll'))return dustAll();
 if(q('#up')){const m=byId(T.id),u=upOf(m),c=UPC[m.rar];if(!u||!has(m.id)||dust()<c)return;me().dust=dust()-c;me().cards[m.id]--;if(!me().cards[m.id])delete me().cards[m.id];me().cards[u.id]=has(u.id)+1;save();SFX.evo();T.id=u.id;vCard();A.insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div><h2>강화 성공!</h2><div class="big-card">${cardHtml(u)}</div><button class="btn" id="ovok">좋아요!</button></div></div>`);return;}
 if(q('#dust1')){const m=byId(T.id);if(has(m.id)>1){me().cards[m.id]--;me().dust=dust()+DUST[m.rar];save();SFX.tap();}return vCard();}
 if(q('#buy')){const m=byId(T.id),c=BUY[m.rar];if(dust()<c)return;const first=!has(m.id);me().dust=dust()-c;me().cards[m.id]=has(m.id)+1;save();SFX.evo();vCard();if(first)A.insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div><h2>새 카드!</h2><div class="big-card">${cardHtml(m)}</div><button class="btn" id="ovok">좋아요!</button></div></div>`);return;}
 if(q('#ovok'))return go('card',{id:T.id});
 if(q('#ovClose')){const o=document.getElementById('ov');if(o)o.remove();return;}
 if(view==='pack'&&(x=q('#gotrow [data-card]'))){if(!T.sqDone)return;const m=byId(+x.dataset.card),sq=document.getElementById('sq');if(!m||!sq)return;SFX.tap();sq.className='sq';sq.innerHTML=`<div class="sqfront">${cardHtml(m,{stat:1})}</div>`;document.querySelectorAll('#gotrow .card').forEach(c=>c.classList.toggle('sel',c===x));document.getElementById('pm').textContent=RAR[m.rar].n+' · '+m.name;return;}
 if(x=q('[data-card]')){const id=+x.dataset.card;if(view==='album'){SFX.tap();return go('card',{id});}
  if(view==='pick'){const P=S.p[T.turn],c=T.sel.filter(v=>v===id).length;if(c<P.cards[id]&&T.sel.length<T.need){T.sel.push(id);SFX.tap();}else if(c){T.sel.splice(T.sel.indexOf(id),1);}return vPick();}}
});
load();

<script>(function(){if(!('serviceWorker' in navigator))return;
let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;reloading=true;location.reload();});
function show(w){var b=document.getElementById('swUpd');b.hidden=false;
  document.getElementById('swNow').onclick=function(){document.getElementById('swMsg').textContent='바꾸는 중…';w.postMessage('SKIP');};
  document.getElementById('swLater').onclick=function(){b.hidden=true;};}
addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(reg){
  if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
  reg.addEventListener('updatefound',function(){var w=reg.installing;if(w)w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)show(w);});});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){});});
}).catch(function(){});});})();</script>
