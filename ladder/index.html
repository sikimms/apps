<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#24352d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사다리타기">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>사다리타기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 위에 설정 카드, 가운데 큰 사다리, 아래 결과표 — 칠판에 분필로 그린 사다리 느낌 */
:root{
  --bg:#eef1ec; --card:#fbfcfa; --ink:#1f2622; --muted:#5f6a64; --rule:#d5dcd6;
  --board:#24352d; --chalk:#f1f4ee; --chalk-dim:rgba(241,244,238,.55);
  --accent:#e0702f; --accent-ink:#ffffff; --accent-soft:#fbe6d8;
  --f-display:"Jua","Noto Sans KR",sans-serif; --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --card:#1a201d; --ink:#e6ebe7; --muted:#9aa6a0; --rule:#2c3530;
  --board:#1b2a23; --accent:#f08a4b; --accent-ink:#1a0f08; --accent-soft:#3a2418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --card:#1a201d; --ink:#e6ebe7; --muted:#9aa6a0; --rule:#2c3530;
  --board:#1b2a23; --accent:#f08a4b; --accent-ink:#1a0f08; --accent-soft:#3a2418; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;margin:0}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-weight:700;font-size:14px;margin-right:4px}
.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);font:500 14px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:18px;padding:8px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.num button{border:0;background:transparent;color:var(--ink);font:700 18px var(--f-body);width:36px;height:34px;cursor:pointer}
.num b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:6px}
.list input{width:100%;font:500 14px var(--f-body);padding:6px 9px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
.stage{background:var(--board);border-radius:16px;padding:14px 10px 12px;box-shadow:inset 0 0 0 6px #6b4a2b,0 14px 30px -18px rgba(0,0,0,.6);overflow:hidden}
svg#lad{display:block;width:100%;height:auto;touch-action:manipulation}
.nm{cursor:pointer}
.nm rect{fill:rgba(255,255,255,.08);stroke:var(--chalk-dim);stroke-width:1.5}
.nm:hover rect,.nm:focus rect{fill:rgba(255,255,255,.18)}
.nm text,.rs text{fill:var(--chalk);font-family:var(--f-display);text-anchor:middle;dominant-baseline:central}
.rs rect{fill:rgba(0,0,0,.18);stroke:var(--chalk-dim);stroke-width:1.5;stroke-dasharray:4 4}
.rs.cover rect{fill:#3e5348;stroke-dasharray:none}
.pole{stroke:var(--chalk);stroke-width:4;stroke-linecap:round;opacity:.9}
.rung{stroke:var(--chalk);stroke-width:4;stroke-linecap:round;opacity:.9}
.trail{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.status{margin-top:10px;color:var(--chalk);font-size:14px;text-align:center;min-height:22px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){.trail{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div><h1>사다리<span>타기</span></h1><div class="sub">누가 커피를 살까? 이름과 결과를 적고 사다리를 타 보세요.</div></div>
  </header>

  <section class="card" aria-label="설정">
    <div class="row">
      <span class="lab">인원</span>
      <div class="num"><button id="minus" aria-label="한 명 줄이기">−</button><b id="cnt">4명</b><button id="plus" aria-label="한 명 늘리기">+</button></div>
      <span class="lab" style="margin-left:10px">빠른 설정</span>
      <button class="btn" data-preset="win">당첨 1명</button>
      <button class="btn" data-preset="coffee">커피 쏘기</button>
      <button class="btn" data-preset="order">순서 정하기</button>
      <button class="btn" data-preset="duty">청소 당번</button>
    </div>
    <div class="grid2">
      <div><div class="lab">참가자 (위)</div><div class="list" id="names"></div></div>
      <div><div class="lab">결과 (아래)</div><div class="list" id="results"></div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="make">사다리 만들기</button>
      <label class="note"><input type="checkbox" id="hide" checked> 결과를 가려 두기</label>
    </div>
  </section>

  <section class="stage" aria-label="사다리">
    <svg id="lad" role="img" aria-label="사다리 그림"></svg>
    <div class="status" id="status">위쪽 이름을 누르면 사다리를 타고 내려가요.</div>
  </section>

  <section class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <span class="lab">결과</span>
      <div class="row"><button class="btn" id="all">모두 공개</button><button class="btn" id="copy">결과 복사</button></div>
    </div>
    <table id="tbl"><thead><tr><th>참가자</th><th>결과</th></tr></thead><tbody></tbody></table>
    <div class="note" style="margin-top:8px">가로줄과 아래 결과 칸의 순서를 보안 난수(crypto)로 무작위로 정해요. 결과 칸 순서까지 섞기 때문에 사다리 모양과 상관없이 누구나 각 결과에 걸릴 확률이 똑같아요.</div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('ladder-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('ladder-'+k,JSON.stringify(v));}catch(e){}}};
function rand(n){const lim=Math.floor(0x100000000/n)*n,a=new Uint32Array(1);let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);return x%n;}
const COLORS=['#ff8a5b','#ffd166','#6fd3a8','#64b5f6','#c792ea','#ff6b9a','#9be15d','#4dd0e1','#ffab40','#b0bec5'];
let N=store.get('n',4),names=store.get('names',[]),results=store.get('results',[]);
let rungs=[],revealed=new Set(),busy=false,LEVELS=14;
const W=()=>Math.max(560,N*96),H=470,TOP=60,BOT=H-60,X=i=>{const w=W();return 48+(w-96)*(N===1?0:i/(N-1));},Y=l=>TOP+18+(BOT-TOP-36)*(l+0.5)/LEVELS;

function fillDefaults(){
  for(let i=0;i<N;i++){if(names[i]==null||names[i]==='')names[i]=`참가자${i+1}`;if(results[i]==null)results[i]='꽝';}
  names.length=N;results.length=N;
}
function renderInputs(){
  $('cnt').textContent=N+'명';
  $('names').innerHTML=names.map((v,i)=>`<input id="n${i}" value="${esc(v)}" maxlength="10" aria-label="참가자 ${i+1}">`).join('');
  $('results').innerHTML=results.map((v,i)=>`<input id="r${i}" value="${esc(v)}" maxlength="10" aria-label="결과 ${i+1}">`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function readInputs(){for(let i=0;i<N;i++){names[i]=($('n'+i).value.trim()||`참가자${i+1}`);results[i]=($('r'+i).value.trim()||'꽝');}store.set('names',names);store.set('results',results);}
function preset(k){
  readInputs();
  if(k==='win')results=Array.from({length:N},(_,i)=>i===0?'당첨':'꽝');
  if(k==='coffee')results=Array.from({length:N},(_,i)=>i===0?'커피 쏘기 ☕':'통과');
  if(k==='order')results=Array.from({length:N},(_,i)=>`${i+1}번`);
  if(k==='duty')results=Array.from({length:N},(_,i)=>['청소','쓰레기','설거지','정리'][i]||'쉬기');
  store.set('results',results);renderInputs();makeLadder();
}
// 사다리는 층마다 가로줄을 무작위로 놓아 자연스럽게 그리고(같은 층에서 한 세로줄에 두 개가 붙지 않게),
// 아래 결과 칸의 순서를 공평하게 섞는다. 그래서 사다리 모양과 상관없이 누구나 각 결과에 걸릴 확률이 같다.
let resOrder=[];
const resultAt=j=>results[resOrder[j]];
function makeLadder(){
  readInputs();revealed=new Set();
  LEVELS=Math.max(10,Math.min(18,N*3));
  const grid=[];
  for(let l=0;l<LEVELS;l++){const row=new Array(N-1).fill(false);
    for(let c=0;c<N-1;c++){if(c>0&&row[c-1])continue;if(rand(100)<44)row[c]=true;}
    grid.push(row);}
  for(let c=0;c<N-1;c++)if(!grid.some(r=>r[c])){const l=rand(LEVELS);if(!(c>0&&grid[l][c-1])&&!(c<N-2&&grid[l][c+1]))grid[l][c]=true;}
  rungs=grid;
  resOrder=Array.from({length:N},(_,i)=>i);for(let i=N-1;i>0;i--){const j=rand(i+1);[resOrder[i],resOrder[j]]=[resOrder[j],resOrder[i]];}
  draw();renderTable();$('status').textContent='위쪽 이름을 누르면 사다리를 타고 내려가요.';
}
function path(start){
  let c=start;const pts=[[X(c),TOP+18]];
  for(let l=0;l<rungs.length;l++){const y=Y(l);
    if(c<N-1&&rungs[l][c]){pts.push([X(c),y],[X(c+1),y]);c++;}
    else if(c>0&&rungs[l][c-1]){pts.push([X(c),y],[X(c-1),y]);c--;}}
  pts.push([X(c),BOT-18]);return{pts,end:c};
}
function draw(){
  const w=W(),bw=Math.min(84,(w-60)/N-8);
  $('lad').setAttribute('viewBox',`0 0 ${w} ${H}`);
  let h='';
  for(let i=0;i<N;i++)h+=`<line class="pole" x1="${X(i)}" y1="${TOP+18}" x2="${X(i)}" y2="${BOT-18}"/>`;
  rungs.forEach((row,l)=>row.forEach((on,c)=>{if(on)h+=`<line class="rung" x1="${X(c)}" y1="${Y(l)}" x2="${X(c+1)}" y2="${Y(l)}"/>`;}));
  h+='<g id="trails"></g>';
  for(let i=0;i<N;i++){const fs=Math.max(13,Math.min(19,bw/ Math.max(3,names[i].length)*1.5));
    h+=`<g class="nm" data-i="${i}" tabindex="0" role="button" aria-label="${esc(names[i])} 사다리 타기"><rect x="${X(i)-bw/2}" y="${TOP-30}" width="${bw}" height="40" rx="10" style="stroke:${COLORS[i%10]}"/><text x="${X(i)}" y="${TOP-10}" font-size="${fs}">${esc(names[i])}</text></g>`;}
  const hide=$('hide').checked;
  for(let j=0;j<N;j++){const open=!hide||[...revealed].some(i=>path(i).end===j);const fs=Math.max(13,Math.min(19,bw/Math.max(3,resultAt(j).length)*1.5));
    h+=`<g class="rs${open?'':' cover'}" data-j="${j}"><rect x="${X(j)-bw/2}" y="${BOT-10}" width="${bw}" height="40" rx="10"/><text x="${X(j)}" y="${BOT+10}" font-size="${open?fs:20}">${open?esc(resultAt(j)):'?'}</text></g>`;}
  $('lad').innerHTML=h;
  for(const i of revealed)drawTrail(i,false);
}
function drawTrail(i,animate){
  const {pts,end}=path(i),d=pts.map((p,k)=>(k?'L':'M')+p[0]+' '+p[1]).join(' ');
  const g=$('trails');const el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('d',d);el.setAttribute('class','trail');el.setAttribute('stroke',COLORS[i%10]);g.appendChild(el);
  if(!animate)return Promise.resolve(end);
  const len=el.getTotalLength();el.style.strokeDasharray=len;el.style.strokeDashoffset=len;
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','9');dot.setAttribute('fill',COLORS[i%10]);dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width','2');g.appendChild(dot);
  const dur=Math.min(2600,900+len*1.3),t0=performance.now();
  return new Promise(res=>{const step=t=>{const k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      el.style.strokeDashoffset=len*(1-e);const p=el.getPointAtLength(len*e);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
      if(k<1)requestAnimationFrame(step);else{dot.remove();res(end);}};requestAnimationFrame(step);});
}
async function ride(i){
  if(busy||revealed.has(i))return;busy=true;$('status').innerHTML=`<b>${esc(names[i])}</b> 내려가는 중…`;
  revealed.add(i);const end=await drawTrail(i,true);
  draw();renderTable();$('status').innerHTML=`<b>${esc(names[i])}</b> → <b>${esc(resultAt(end))}</b>`;busy=false;
}
function renderTable(){
  $('tbl').querySelector('tbody').innerHTML=names.map((nm,i)=>{const r=revealed.has(i)?resultAt(path(i).end):'';
    return `<tr><td><span class="sw" style="background:${COLORS[i%10]}"></span>${esc(nm)}</td><td>${revealed.has(i)?`<span class="pill">${esc(r)}</span>`:'<span class="note">아직 몰라요</span>'}</td></tr>`;}).join('');
}
$('lad').addEventListener('click',e=>{const g=e.target.closest('.nm');if(g)ride(+g.dataset.i);});
$('lad').addEventListener('keydown',e=>{const g=e.target.closest('.nm');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ride(+g.dataset.i);}});
$('all').onclick=async()=>{for(let i=0;i<N;i++)if(!revealed.has(i)){await ride(i);}};
$('make').onclick=makeLadder;
$('hide').onchange=draw;
$('minus').onclick=()=>{if(N<=2)return;readInputs();N--;store.set('n',N);fillDefaults();renderInputs();makeLadder();};
$('plus').onclick=()=>{if(N>=10)return;readInputs();N++;store.set('n',N);fillDefaults();renderInputs();makeLadder();};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));
$('copy').onclick=async()=>{
  const txt=names.map((nm,i)=>`${nm} → ${resultAt(path(i).end)}`).join('\n');
  try{await navigator.clipboard.writeText(txt);$('status').textContent='결과를 복사했어요.';}catch(e){$('status').textContent='복사가 막혀 있어요: '+txt.replace(/\n/g,' / ');}
};
if(!(N>=2&&N<=10))N=4;
if(!results.length)results=['당첨','꽝','꽝','꽝'];
fillDefaults();renderInputs();makeLadder();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
